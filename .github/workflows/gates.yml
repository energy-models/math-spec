name: Gates

# The two checks that need something the test suite cannot provide: a TeX
# toolchain, and a full documentation build.
#
# A workflow of its own rather than jobs added to ci.yml, which the copier
# template owns and rewrites — see RELEASING.md. Both jobs are Linux-only and
# single-Python: neither claim is about portability, so running them across the
# matrix would buy nothing and cost eight more billed minutes.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  latex:
    name: Every model renders to LaTeX that compiles
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0

      # Deliberately minimal, and each entry earns its place:
      #   texlive-latex-base        geometry.sty and amsmath.sty (and pulls in
      #                             texlive-base, which carries amssymb.sty)
      #   texlive-fonts-recommended the msam/msbm fonts amssymb *draws* with —
      #                             \mathbb and \ominus are unset without them
      # If the preamble grows a \usepackage, this list grows with it. That is
      # the point: it keeps the preamble installable from a small TeX.
      - name: Install a minimal TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            texlive-latex-base texlive-fonts-recommended

      - name: Render every model
        run: pixi run render-tex build/tex

      # One pdflatex per model, in parallel. `-halt-on-error` so a failure is
      # the first error rather than a log to read backwards.
      - name: Compile them
        run: |
          printf '%s\0' build/tex/*.tex |
            xargs -0 -P "$(nproc)" -n1 pdflatex -halt-on-error \
              -interaction=nonstopmode -output-directory build/tex

  docs:
    name: The site builds strictly
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      # `docs-build` carries `--strict`, so a dead cross-link, a page missing
      # from the nav, or an anchor that stopped resolving fails here. This is
      # also the closest thing to a rehearsal of the Read the Docs build.
      - name: Build the site
        run: pixi run docs-build build
