name: Changelog

# A feat, fix, perf, refactor, docs or revert PR adds its line under
# `## Upcoming version` in CHANGELOG.md, so the release notes exist before the
# release PR is written. The label `no changelog` opts a PR out. See
# RELEASING.md.
#
# An edit to the PR description changes nothing this reads, so `edited` is not
# a trigger. A title edit can change the type, so pr-title.yml re-runs this
# check when the title changes, and this reads the title and the labels live
# rather than from the event, so a re-run sees them as they are now. The job
# never skips: a skipped required check counts as passed, and would hide an
# earlier failure.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  line:
    name: Changelog line
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch's changelog is what a new line is told apart from.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the PR adds the line it owes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          title=$(gh api "repos/${REPO}/pulls/${NUMBER}" --jq '.title')
          if gh api "repos/${REPO}/pulls/${NUMBER}" --jq '.labels[].name' | grep -qx 'no changelog'; then
            echo "opted out by the label 'no changelog'"
            exit 0
          fi
          git show "origin/${BASE_REF}:CHANGELOG.md" > "${RUNNER_TEMP}/base.md"
          python3 -m tools.changelog entry "$title" "${RUNNER_TEMP}/base.md"
