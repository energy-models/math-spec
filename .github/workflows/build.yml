name: Build
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from `git describe`, so the tags have
          # to be here. A shallow clone builds a 0.0.1.dev-something wheel.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          locked: true
          # Off, deliberately: this job publishes the artifact a tag ships, and
          # a restored cache is writable by any job that can populate it.
          cache: false
      # There is no version to substitute, so the template's `Derive version`
      # and `Replace version` steps are gone rather than fixed.
      # `[tool.hatch.version] source = "vcs"` reads the tag directly: the tag
      # and the wheel cannot disagree, and there is nothing to verify
      # afterwards.
      #
      # #23 hardened that `sed` on main — anchored, escaped, and failing loudly
      # when it matches nothing. Both bugs it fixes are unreachable here,
      # because pyproject.toml is `dynamic = ["version"]` and carries no
      # version literal at all. Merging its version back in would do the
      # opposite of what it intends: the pattern would match nothing, and its
      # new guard would fail every tagged build.
      - name: Build project
        run: pixi run build-wheel
      - name: Check package
        run: pixi run check-wheel
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact
          path: dist/*

  release:
    name: Publish package
    # Off, and not by a variable. `math-spec` is not registered on PyPI and
    # nothing here should reach it yet; the previous condition was the tag alone,
    # so any tag would have attempted an upload and failed on a missing trusted
    # publisher. A repository variable would have been the wrong switch — anyone
    # can set one, with no review. Turning this back on takes a pull request.
    #
    # To publish: register the project, configure a trusted publisher pointing at
    # this workflow and the `pypi` environment, then restore the tag condition.
    #
    # Kept rather than deleted so the pinned action SHAs stay under dependabot;
    # a job restored from git history comes back with whatever was current then.
    #
    # GitHub releases do not pass through here — release-please cuts those from
    # the tag in release.yml, and they are unaffected either way.
    if: false
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact
          path: dist
      - name: Publish package on PyPi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
