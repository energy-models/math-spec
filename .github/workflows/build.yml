name: Build
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from `git describe`, so the tags have
          # to be here. A shallow clone builds a 0.0.1.dev-something wheel.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          locked: true
          # Off, deliberately: this job publishes the artifact a tag ships, and
          # a restored cache is writable by any job that can populate it.
          cache: false
      # No version to substitute, so the template's `sed` over pyproject.toml is
      # gone: `[tool.hatch.version] source = "vcs"` reads the tag directly, the
      # tag and the wheel cannot disagree, and there is nothing to verify
      # afterwards.
      - name: Build project
        run: pixi run build-wheel
      - name: Check package
        run: pixi run check-wheel
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact
          path: dist/*

  release:
    name: Publish package
    # The alpha stream cuts a release on *every* merge to main, so without this
    # gate turning release.yml on would start pushing an alpha to PyPI several
    # times a day, and would fail red on each one until a trusted publisher
    # exists for math-spec. Set the repo variable PUBLISH_TO_PYPI to "true" to
    # go live; the tag, the GitHub release and the artifact happen regardless.
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact
          path: dist
      - name: Publish package on PyPi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
