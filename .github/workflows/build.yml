name: Build
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      - name: Derive version
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "version=$(git describe --tags --abbrev=0 | sed 's/^v//')" >> $GITHUB_OUTPUT
      - name: Replace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Anchored to the version line, dots escaped, not global. The previous
          # pattern was an unescaped regex applied everywhere in the file, so a
          # dependency floor like `some-lib>=0.0.0` or a URL with 0.0.0 in it was
          # rewritten alongside the version.
          before=$(sha1sum pyproject.toml)
          sed -i -E "s|^version = \"0\\.0\\.0\"$|version = \"${STEPS_VERSION_OUTPUTS_VERSION}\"|" pyproject.toml
          # And fail loudly when it matches nothing. Silently, this workflow
          # builds and uploads a wheel still versioned 0.0.0 under whatever tag
          # triggered it, and nothing downstream checks.
          if [ "$before" = "$(sha1sum pyproject.toml)" ]; then
            echo "::error::version literal not found; the wheel would ship as 0.0.0 under tag ${STEPS_VERSION_OUTPUTS_VERSION}"
            exit 1
          fi
          grep -n '^version = ' pyproject.toml
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
      - name: Build project
        run: pixi run build-wheel
      - name: Check package
        run: pixi run check-wheel
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact
          path: dist/*

  release:
    name: Publish package
    # Off, and not by a variable. `math-spec` is not registered on PyPI and
    # nothing here should reach it yet; the previous condition was the tag alone,
    # so any tag would have attempted an upload and failed on a missing trusted
    # publisher. A repository variable would have been the wrong switch — anyone
    # can set one, with no review. Turning this back on takes a pull request.
    #
    # To publish: register the project, configure a trusted publisher pointing at
    # this workflow and the `pypi` environment, then restore the tag condition.
    #
    # Kept rather than deleted so the pinned action SHAs stay under dependabot;
    # a job restored from git history comes back with whatever was current then.
    #
    # GitHub releases do not pass through here — release-please cuts those from
    # the tag in release.yml, and they are unaffected either way.
    if: false
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact
          path: dist
      - name: Publish package on PyPi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
