name: Build
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from `git describe`, so the tags have
          # to be here. A shallow clone builds a 0.1.dev-something wheel.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Off, deliberately: this job publishes the artifact a tag ships, and
          # a restored cache is writable by any job that can populate it. One
          # `uv build` has nothing to gain from it anyway.
          enable-cache: false
      # No version to substitute: `[tool.hatch.version] source = "vcs"` reads
      # the tag directly, so the tag and the wheel cannot disagree and there is
      # nothing to verify afterwards.
      - name: Build project
        run: uv build
      - name: Check package
        run: uvx twine check dist/*
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact
          path: dist/*

  release:
    name: Publish package
    # The alpha stream cuts a release on *every* merge to main, so without this
    # gate turning release.yml on would start pushing an alpha to PyPI several
    # times a day, and would fail red on each one until a trusted publisher
    # exists for math-spec. Set the repo variable PUBLISH_TO_PYPI to "true" to
    # go live; the tag, the GitHub release and the artifact happen regardless.
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact
          path: dist
      - name: Publish package on PyPi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
