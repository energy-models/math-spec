name: PyPSA parity

# Advisory: runs lpspec's differential runner, at the ref the committed stamps
# were certified with, over this checkout. Red means a corpus change broke
# parity, or a re-certification would rewrite `references.json` — the stamps
# are stale. Not a required check: red can also be the corpus moving past the
# language the pinned lpspec reads, resolved only by lpspec bumping its pin.
# `tests/test_pypsa_references.py` holds the stamps to this ref.

on:
  pull_request:
    paths:
      - examples/**
      - .github/workflows/pypsa-parity.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    name: PyPSA parity (advisory)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the certifying lpspec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fluxopt/lpspec
          # fluxopt/lpspec#1318 head; a release tag once one exists.
          ref: 6f2cbbc64f6b3b420c273aaf21ce25a9be487f23
          path: lpspec
          persist-credentials: false
      - name: Install pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          run-install: false
      - name: Run every rung against pypsa, with the pinned lpspec
        working-directory: lpspec
        run: >
          pixi exec -s uv uv run
          --with-editable ".[linopy]"
          --with "pypsa==1.3.0" --with "highspy==1.15.1" --with "polars>=1.30"
          python differential/pypsa/parity.py "$GITHUB_WORKSPACE"
      - name: The committed stamps are what this lpspec certifies
        # Stamped floats (solver results, epsilon-sized gaps) and scm version
        # strings are not bit-reproducible across environments, so the
        # comparison is semantic: floats to 1e-9, versions by their +g<sha>
        # commit, everything else — verdicts, counts, blockers, keys — exact.
        run: |
          python3 - <<'EOF'
          import json, math, subprocess, sys

          FILE = 'examples/references/pypsa/references.json'
          show = subprocess.run(['git', 'show', f'HEAD:{FILE}'], capture_output=True, text=True, check=True)
          committed, fresh = json.loads(show.stdout), json.load(open(FILE))

          def diff(a, b, path):
              if isinstance(a, bool) or isinstance(b, bool):
                  return [] if a is b else [f'{path}: {a!r} != {b!r}']
              if isinstance(a, (int, float)) and isinstance(b, (int, float)):
                  ok = math.isclose(a, b, rel_tol=1e-9, abs_tol=1e-9)
                  return [] if ok else [f'{path}: {a!r} != {b!r}']
              if isinstance(a, str) and isinstance(b, str) and '+g' in a and '+g' in b:
                  return [] if a.split('+g')[1] == b.split('+g')[1] else [f'{path}: {a!r} != {b!r}']
              if type(a) is not type(b):
                  return [f'{path}: {a!r} != {b!r}']
              if isinstance(a, dict):
                  if a.keys() != b.keys():
                      return [f'{path}: keys {sorted(a.keys() ^ b.keys())} differ']
                  return [line for key in a for line in diff(a[key], b[key], f'{path}.{key}')]
              if isinstance(a, list):
                  if len(a) != len(b):
                      return [f'{path}: {len(a)} items != {len(b)}']
                  return [line for i, (x, y) in enumerate(zip(a, b)) for line in diff(x, y, f'{path}[{i}]')]
              return [] if a == b else [f'{path}: {a!r} != {b!r}']

          lines = diff(committed, fresh, '$')
          print('\n'.join(lines) or 'the committed stamps are what this lpspec certifies')
          sys.exit(1 if lines else 0)
          EOF
