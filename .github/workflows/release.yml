name: Release

# Opens and maintains a release PR from the conventional commits on main.
# Merging it tags the release, and that tag is what build.yml already reacts to
# — release-please never edits pyproject.toml, so the two halves compose without
# either knowing about the other. See RELEASING.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target-branch:
        description: "Release line to run against (e.g. a 0.1.x maintenance branch). Defaults to main."
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ inputs.target-branch || github.ref_name }}
  cancel-in-progress: false

# secrets are not readable from a step-level `if`, so hoist the check here
env:
  HAS_RELEASE_APP: ${{ secrets.APP_CLIENT_ID != '' }}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Two things a GITHUB_TOKEN cannot do, both of which this workflow needs:
      # a PR it authors does not trigger CI, and a tag it pushes does not trigger
      # build.yml. Without the app the release is opened but never built.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Narrow the token to what release-please and the auto-merge step
          # actually do, rather than inheriting whatever the installation was
          # granted: commits, the tag and the GitHub release (contents), and
          # the release PR itself (pull-requests).
          permission-contents: write
          permission-pull-requests: write

      - name: Warn when falling back to GITHUB_TOKEN
        if: env.HAS_RELEASE_APP != 'true'
        run: |
          echo "::warning::APP_CLIENT_ID is unset — using GITHUB_TOKEN. The release PR will not run CI and its tag will not trigger build.yml. See RELEASING.md."

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ inputs.target-branch || 'main' }}
