name: Feature Request
description: Suggest an idea for math-spec.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for letting us know about your idea!
  - type: textarea
    id: description
    attributes:
      label: What can be improved?
      placeholder: Tell us what you would like to see!
      value: "math-spec should be more memory efficient!"
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version
      description: What version of math_spec are you using?
      placeholder: v0.0.1
    validations:
      required: true
