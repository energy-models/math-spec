dimensions:
  generator: {}
  zone: {}
  period: { dtype: int }

lookups:
  zone_of: { over: generator, into: zone, per: [period] }

parameters:
  demand: { dims: [zone, period] }
  cost: { dims: [generator] }

variables:
  p: { foreach: [generator, period], bounds: { lower: 0 } }

constraints:
  history:
    foreach: [generator, zone]
    expression: sum(p, by=zone_of) <= 100

objective: { sense: minimize, expression: sum(p * cost) }
