dimensions:
  generator: {}
  product: {}
  period: { dtype: int }
parameters:
  eligible: { dims: [generator, product], dtype: int }
  requirement: { dims: [product, period] }
  cost: { dims: [generator] }
variables:
  r: { foreach: [generator, period], bounds: { lower: 0 } }
constraints:
  reserve:
    foreach: [product, period]
    expression: sum(r * eligible, over=generator) >= requirement
objective: { sense: minimize, expression: sum(r * cost) }
