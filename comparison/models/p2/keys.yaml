dimensions:
  generator: {}
  zone: {}
  period: { dtype: int }

lookups:
  zone_of: { over: [generator, period], into: zone }

parameters:
  demand: { dims: [zone, period] }
  cost: { dims: [generator] }

variables:
  p: { foreach: [generator, period], bounds: { lower: 0 } }

constraints:
  zone_balance:
    foreach: [zone, period]
    expression: sum(p, by=zone_of.generator) >= demand
  history:
    foreach: [generator, zone]
    expression: sum(p, by=zone_of.period) <= 100

objective: { sense: minimize, expression: sum(p * cost) }
