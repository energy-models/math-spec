dimensions:
  generator: {}
  zone: {}
  period: { dtype: int }

lookups:
  zone_of: { over: generator, into: zone, per: [period] }
  zone_of_by_period: { over: period, into: zone, per: [generator] }

parameters:
  demand: { dims: [zone, period] }
  cost: { dims: [generator] }

variables:
  p: { foreach: [generator, period], bounds: { lower: 0 } }

constraints:
  zone_balance:
    foreach: [zone, period]
    expression: sum(p, by=zone_of) >= demand
  history:
    foreach: [generator, zone]
    expression: sum(p, by=zone_of_by_period) <= 100

objective: { sense: minimize, expression: sum(p * cost) }
