dimensions:
  bus: {}
  line: {}
  generator: {}
  period: { dtype: int }

lookups:
  gen_bus: { columns: [generator, bus], key: generator }
  ends: { columns: { line: line, bus0: bus, bus1: bus }, key: line }

parameters:
  load: { dims: [bus, period] }
  cost: { dims: [generator] }

variables:
  p: { foreach: [generator, period], bounds: { lower: 0 } }
  f: { foreach: [line, period] }

constraints:
  nodal:
    foreach: [bus, period]
    expression: sum(p, by=gen_bus) + sum(f, by=ends, produce=bus1) - sum(f, by=ends, produce=bus0) == load
  no_loop:
    foreach: [line, period]
    where: "ends.bus0 != ends.bus1"
    expression: f <= 10

objective: { sense: minimize, expression: sum(p * cost) }
