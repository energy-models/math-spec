version = 1
SPDX-PackageName = "math-spec"
SPDX-PackageSupplier = "energy-models Org <https://github.com/energy-models>"
SPDX-PackageDownloadLocation = "https://github.com/energy-models/math-spec"

# JSON takes no comments, so the two release-please files are annotated rather
# than headed. The manifest is rewritten by the bot on every release, which is a
# second reason not to put anything in it that has to survive.
[[annotations]]
path = [
  ".github/pull_request_template.md",
  ".all-contributorsrc",
  ".release-please-config.json",
  ".release-please-manifest.json",
  "src/py.typed",
]
SPDX-FileCopyrightText = "math-spec contributors"
SPDX-License-Identifier = "CC0-1.0"

# CHANGELOG.md carries its own header too, but release-please rewrites the file
# and does not promise to keep it. Annotated so `reuse lint` does not start
# failing at the first release.
[[annotations]]
path = ["CHANGELOG.md", "resources/**/*"]
SPDX-FileCopyrightText = "math-spec contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["pixi.lock"]
SPDX-FileCopyrightText = "math-spec contributors"
SPDX-License-Identifier = "MIT"
