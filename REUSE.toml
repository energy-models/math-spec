version = 1
SPDX-PackageName = "mathspec"
SPDX-PackageSupplier = "energy-models Org <https://github.com/energy-models>"
SPDX-PackageDownloadLocation = "https://github.com/energy-models/mathspec"

# Everything here is a file that cannot carry a header of its own: JSON has no
# comments, a lockfile and the generated outputs are rewritten by the thing
# that produces them, and `.gitkeep` and `py.typed` are empty on purpose.

[[annotations]]
path = [
  ".github/pull_request_template.md",
  ".all-contributorsrc",
  # `src/py.typed` on main, which is a path that does not exist — the marker
  # is inside the package.
  "src/mathspec/py.typed",
]
SPDX-FileCopyrightText = "mathspec contributors"
SPDX-License-Identifier = "CC0-1.0"

# A skill file opens with YAML front matter, which has to be line 1, so the
# header cannot go above it. The skill is prose, under the prose licence.
[[annotations]]
path = [".claude/skills/**/SKILL.md"]
SPDX-FileCopyrightText = "mathspec contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["resources/**/*"]
SPDX-FileCopyrightText = "mathspec contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["examples/references/pypsa/references.json"]
SPDX-FileCopyrightText = "mathspec contributors"
SPDX-License-Identifier = "CC0-1.0"

# The rung scripts and the spine are printed verbatim on the docs pages —
# `tools/gallery.py` shows each as the artifact under review — so an in-file
# header would render as license boilerplate on every rung.
[[annotations]]
path = [
  "examples/references/pypsa/rung_*.py",
  "examples/references/pypsa/spine.py",
]
SPDX-FileCopyrightText = "mathspec Contributors"
SPDX-License-Identifier = "MIT"

# The expansion pairs are printed verbatim on the docs pages as the before and
# after of `expand()`, so an in-file header would render there too.
[[annotations]]
path = ["tests/expand/**/*.yaml"]
SPDX-FileCopyrightText = "mathspec Contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["pixi.lock"]
SPDX-FileCopyrightText = "mathspec contributors"
SPDX-License-Identifier = "MIT"

# `schema/mathspec.schema.json` is `Model.model_json_schema()` written out by
# `tools/schema.py`, and the three `.out` files are what
# `python -m tests.typesetting.golden` prints. A header in any of them would last
# until the next regeneration, and tests/test_schema.py compares the file to
# the models byte for byte.
[[annotations]]
path = ["schema/*.json", "tests/typesetting/golden/*.out"]
SPDX-FileCopyrightText = "mathspec Contributors"
SPDX-License-Identifier = "MIT"
