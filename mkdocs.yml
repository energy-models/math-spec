site_name: "mathspec"
site_description: The language an optimisation model is written in — YAML math, checked before any data is bound, and printable as the math it means
site_url: https://mathspec.readthedocs.io/en/latest/
repo_url: https://github.com/energy-models/mathspec
repo_name: energy-models/mathspec
edit_uri: edit/main/docs/
strict: true

validation:
  # Under `strict: true` a warning is a failed build, which is the point: a
  # page added without a nav entry, or a cross-link that stopped resolving,
  # fails CI rather than shipping.
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  # Arranged by what a page is for — tutorial, how-to guide, reference,
  # explanation (https://diataxis.fr) — for someone who writes a spec.
  # `.claude/skills/docs-writing/SKILL.md` says how one kind is told from
  # another, and the folders under `docs/` follow the same split. The example
  # pages are reference in their own form and sit at the end of the Reference
  # section, after the pages a reader looks things up in.
  - Tutorials:
      - Your first spec: first-spec.md
  - How-to guides:
      - Installation: howto/installation.md
      - Check a spec without data: howto/check.md
      - Print a spec as math: howto/print.md
      - State a rule that differs by regime: howto/regimes.md
      - Declare a column of data: howto/declare-a-column.md
      - Fix a quantity that is data in one model and a decision in another: howto/pin-a-variable.md
      - Write a piecewise curve out by hand: howto/curve-by-hand.md
      - See what a curve or a set expands to: howto/see-an-expansion.md
  - Reference:
      - Language:
          - reference/language/index.md
          - File shape: reference/language/file.md
          - Parameters, variables, constraints and the objective: reference/language/declarations.md
          - Dimensions: reference/language/dimensions.md
          - Relations: reference/language/relations.md
          - Expressions: reference/language/expressions.md
          - Named expressions and macros: reference/language/named.md
          - Operators: reference/language/operators.md
          - Piecewise curves and SOS: reference/language/piecewise.md
          - Assumptions: reference/language/assumptions.md
          - Absence and where: reference/language/absence.md
          - Errors and limits: reference/language/errors.md
      - Typeset the math: reference/typeset.md
      - Python API: reference/api.md
      - Glossary: reference/glossary.md
      - Examples:
          - examples/index.md
          - Least-cost dispatch: examples/dispatch.md
          - Unit commitment: examples/commitment.md
          - One construct per spec: examples/operators.md
  - About:
      - The limits: about/limits.md
      - Versions: about/versions.md
      - Changelog: changelog.md
  # Everything a spec writer does not need, grouped by reader: whoever
  # writes a tool against `Spec` and `Program` (an engine such as specsolve, a
  # renderer, a checker), whoever changes mathspec itself, and the proofs of
  # concept: the notation page, which renders the typesetting test spec, and
  # the PyPSA pages. The PyPSA pages stay in `docs/examples/`, where
  # `tools/gallery.py` writes them.
  - Development:
      - Building on mathspec:
          - Reading a spec and its program: reference/reading.md
          - Program API: reference/program.md
          - What counts as language: about/what-counts-as-language.md
      - Contributing:
          - contributing.md
          - What counts as public API: about/what-counts-as-public-api.md
      - Proofs of concept:
          - Every construct, as math: reference/notation.md
          - PyPSA in one file: examples/pypsa.md
          - PyPSA, the quadratic class: examples/pypsa_quadratic.md
          - PyPSA, the relaxed commitment: examples/pypsa_linearized_uc.md
          - PyPSA, the lossy lines: examples/pypsa_losses.md
          - PyPSA, the two-stage class: examples/pypsa_stochastic.md
          - PyPSA, the multi-period class: examples/pypsa_multi_period.md

theme:
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to system preference

  icon:
    repo: fontawesome/brands/github

  features:
    - header.autohide
    # `docs/static/mathjax.js` subscribes to `document$` and re-typesets, which
    # is what makes this safe: instant navigation swaps the document without a
    # reload, so a page reached from one with no math would otherwise render
    # every equation as literal text.
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - content.action.edit

# The prose licence, on every page — CC-BY asks for attribution, so it has to be
# visible to a reader of the site, not only to a reader of the repository.
copyright: >
  The documentation is licensed
  <a href="https://github.com/energy-models/mathspec/blob/main/LICENSES/CC-BY-4.0.txt">CC-BY-4.0</a>;
  the code is
  <a href="https://github.com/energy-models/mathspec/blob/main/LICENSE">MIT</a>.
site_dir: .docs
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  # A list that starts at 5 renders from 5, as it does on GitHub.
  - sane_lists
  - tables
  - pymdownx.details
  # The math. `generic: true` rewrites `$…$` into `\(…\)` before MathJax runs;
  # `docs/static/mathjax.js` is the other half. Without both, every equation
  # this project's own typesetter prints renders as literal dollar signs — on a
  # site whose subject is the math a file means.
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
        # A ```math fence is how GitHub takes block math verbatim, and is what
        # this project's own typesetter prints. Arithmatex reads `$$…$$`, so
        # the fence hands it over — indented inside a tab or a list included,
        # which is why this is superfences' job and not a hook's regex.
        - name: math
          class: arithmatex
          format: { object: pymdownx.arithmatex.arithmatex_fenced_format, kwds: { which: generic } }
  - pymdownx.emoji:
      emoji_index: zensical.extensions.emoji.twemoji
      emoji_generator: zensical.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  # No `style_plain_text`: it makes every plain inline code span render as
  # shell, and most of the ones here are YAML keys and Python names.
  - pymdownx.inlinehilite
  # `check_paths` so a renamed include fails the build rather than rendering
  # as nothing. `docs/index.md` pulls sections of the README through this, and
  # `docs/changelog.md` is the whole of CHANGELOG.md.
  - pymdownx.snippets:
      check_paths: true
  # The other half of the math, beside the `arithmatex` entry above: the
  # verbatim `$`…`$` pair the typesetter prints for GitHub, rewritten into the
  # `$…$` arithmatex reads. It is a preprocessor rather than a hook because
  # zensical has no hooks, and because the suite can then load it without a
  # site.
  - tools.mdx_github_math
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: "#"
      toc_depth: 3
      # GitHub's slug rules, not mkdocs'. Every page here is read in both
      # places and they cross-link by anchor — `pypsa_losses.md#rung-13
      # --transmission-losses`, whose double hyphen is an em dash GitHub
      # drops. The default slugifier collapses that to one, so such a link
      # would 404 on the site while working in the repository. Same file,
      # same anchor, both renderings.
      slugify: { object: pymdownx.slugs.slugify, kwds: { case: lower } }
plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_section_style: spacy
            show_bases: true
            filters:
              - "!^_"
            merge_init_into_class: true
            show_if_no_docstring: true
            signature_crossrefs: true
            scoped_crossrefs: true
            show_root_toc_entry: false
            show_signature_annotations: false
          paths: [src]
watch:
  - src/mathspec
  - README.md
  - CHANGELOG.md
extra_css:
  - static/extras.css
extra_javascript:
  - static/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/energy-models/mathspec
      name: mathspec on GitHub
    - icon: simple/pypi
      link: https://pypi.org/project/mathspec/
      name: mathspec on PyPI
