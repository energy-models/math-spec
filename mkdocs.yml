site_name: "math-spec"
site_description: The language an optimisation model is written in — YAML math, checked before any data is bound, and printable as the math it means
site_url: https://math-spec.readthedocs.io/en/latest/
repo_url: https://github.com/energy-models/math-spec
repo_name: energy-models/math-spec
edit_uri: edit/main/docs/
strict: true

validation:
  # Under `strict: true` a warning is a failed build, which is the point: a
  # page added without a nav entry, or a cross-link that stopped resolving,
  # fails CI rather than shipping.
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Installation: installation.md
  - Examples:
      - examples/index.md
      - Least-cost dispatch: examples/dispatch.md
      - One construct per model: examples/operators.md
      - PyPSA in one file: examples/pypsa.md
  - Reference:
      - Language:
          - reference/language/index.md
          - File shape: reference/language/file.md
          - Parameters, variables, constraints: reference/language/declarations.md
          - Dimensions and lookups: reference/language/dimensions.md
          - Expressions: reference/language/expressions.md
          - Operators: reference/language/operators.md
          - Piecewise curves and SOS: reference/language/piecewise.md
          - Absence and where: reference/language/absence.md
          - Reading a loaded model: reference/language/reading.md
          - Errors and limits: reference/language/errors.md
      - Every construct, as math: reference/notation.md
      - Typeset the math: reference/typeset.md
  - About:
      - The ceiling: about/ceiling.md
      - What counts as language: about/what-counts-as-language.md
      - Modelling PyPSA in one file: about/pypsa.md
  - Contributing: contributing.md
  - Changelog: CHANGELOG.md

theme:
  name: material
  language: en

  palette:
    # Dark first = default for new visitors (no auto/system-pref entry).
    # Icon represents the CURRENT scheme — moon when active is dark,
    # sun when active is light. The `name` describes the toggle action.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

  font:
    text: Roboto
    code: JetBrains Mono

  icon:
    repo: fontawesome/brands/github

  features:
    - header.autohide
    # navigation.instant left off — MathJax fails to re-typeset on
    # no-math → math swaps, and no documented reset recipe fixes it.
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.action.edit

# The prose licence, on every page — CC-BY asks for attribution, so it has to be
# visible to a reader of the site, not only to a reader of the repository.
copyright: >
  The documentation is licensed
  <a href="https://github.com/energy-models/math-spec/blob/main/LICENSES/CC-BY-4.0.txt">CC-BY-4.0</a>;
  the code is
  <a href="https://github.com/energy-models/math-spec/blob/main/LICENSE">MIT</a>.
site_dir: .docs
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  # The math. `generic: true` rewrites `$…$` into `\(…\)` before MathJax runs;
  # `docs/static/mathjax.js` is the other half. Without both, every equation
  # this project's own typesetter prints renders as literal dollar signs — on a
  # site whose subject is the math a file means.
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  # No `style_plain_text`: it makes every plain inline code span render as
  # shell, and most of the ones here are YAML keys and Python names.
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: "#"
      toc_depth: 3
      # GitHub's slug rules, not mkdocs'. Every page here is read in both
      # places and they cross-link by anchor — `errors.md#the-ceiling--in-one
      # -table`, whose double hyphen is an em dash GitHub drops. The default
      # slugifier collapses that to one, so such a link would 404 on the site
      # while working in the repository. Same file, same anchor, both
      # renderings.
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }
hooks:
  - docs/static/hooks.py
plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_section_style: spacy
            show_bases: true
            filters:
              - "!^_"
            merge_init_into_class: true
            show_if_no_docstring: true
            signature_crossrefs: true
            show_root_toc_entry: false
            show_signature_annotations: false
          paths: [src]
watch:
  - src/math_spec
  - README.md
  - CHANGELOG.md
extra_css:
  - static/extras.css
extra_javascript:
  - static/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/energy-models/math-spec
      name: math-spec on GitHub
    - icon: simple/pypi
      link: https://pypi.org/project/math-spec/
      name: math-spec on PyPI
