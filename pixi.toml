[workspace]
name = "math-spec"
channels = ["conda-forge"]
# No `exclude-newer`. A rolling supply-chain delay and `preview =
# ["pixi-build"]` cannot both hold: the build backend this workspace needs is
# resolved from conda-forge like any other package, and the only
# `pixi-build-python` matching a current pixi's backend API is days old. A 7-day
# cutoff excludes it, and CI goes red with no commit behind it — which is what
# happened between 2026-08-17 (green) and 2026-08-21 (red) on one commit.
# Windows of 3d, 5d, 6d and 7d were all tried; only "now" resolves. pixi.lock is
# what makes a build reproducible here.
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
preview = ["pixi-build"]

[package]
name = "math-spec"
# The version of the *local development install* only. pyproject.toml has
# `dynamic = ["version"]`, and pixi needs a literal here to name the package it
# is about to build. Nothing ships from this: the wheel a tag publishes comes
# from `pixi run build-wheel`, where hatch-vcs reads the version off the tag.
version = "0.0.0"
[package.build.backend]
name = "pixi-build-python"
version = "*"
[package.host-dependencies]
python = ">=3.12"
# The floors are pyproject.toml's `build-system.requires`: 1.27 is the first
# hatchling with the PEP 639 licence fields, and hatch-vcs is what reads the
# version off the tag.
hatchling = ">=1.27"
hatch-vcs = "*"
uv = "*"

# The runtime dependencies, mirrored from `[project.dependencies]` in
# pyproject.toml, which stays the source of truth for what a PyPI install
# gets. pixi-build-python does not read them out of a standalone pixi.toml
# workspace, so a wheel built here would import against an environment that
# has none of them. Keep the two lists in step; the floors are argued for in
# pyproject.toml.
[package.run-dependencies]
pydantic = ">=2.1"
pyparsing = ">=3.1"
pyyaml = ">=6.0"

[dependencies]
math-spec = { path = "." }

[feature.test.dependencies]
pytest = ">=8"
pytest-cov = ">=6"
# `-n auto` for the suite — what the `test` task passes. Deliberately not in
# `addopts`: `-x`, `--pdb` and readable single-test output all want one
# process, and a run of one test file pays the worker startup for nothing.
pytest-xdist = ">=3.8"
# Pinned exactly, because the gate's *output* is the contract: a new release
# that reports one more thing turns a green branch red without a commit. Held
# to the same version the lint feature pins ruff to.
pyrefly = "==1.2.0"
# yaml ships no annotations of its own, and `untyped-import` is an error: the
# stubs are what make the two `import yaml` lines in src/ answerable rather
# than suppressed.
types-pyyaml = ">=6.0"
[feature.test.pypi-dependencies]
# The PyPI bindings, which compile in-process — not conda-forge's `typst`,
# which is the CLI binary and cannot be imported. Three compile tests in
# tests/typesetting/test_formats.py skip without it.
typst = ">=0.15.0"
[feature.test.tasks]
test = "pytest -q -n auto"
test-coverage = "pytest --cov=math_spec --cov-report=xml --cov-report=term-missing"
typecheck = "pyrefly check"
# Half the render gate: every model to standalone LaTeX. `compile-tex` in the
# tex feature is the half that proves the LaTeX is real.
render-tex = { cmd = "python -m tools.render_tex {{ dir }}", args = [
  { arg = "dir", default = "build/tex" },
] }

[feature.build.dependencies]
python = "*"
hatchling = ">=1.27"
# `--no-isolation` below means the backend is this environment, not one pip
# builds on the fly — so the plugin that reads the version off the tag has to
# be installed here or `source = "vcs"` has nothing to call.
hatch-vcs = "*"
python-build = "*"
twine = ">=6"
[feature.build.tasks]
build-wheel = "python -m build --no-isolation ."
check-wheel = "twine check dist/*"

[feature.lint.dependencies]
lefthook = "*"
# Pinned exactly for the same reason as pyrefly above: `ruff format` decides
# what formatted means, and a floating version means CI and the hook can
# disagree about it.
ruff = "==0.16.1"
prettier = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
zizmor = "*"
reuse = "*"
[feature.lint.tasks]
pre-commit-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"

[feature.docs.dependencies]
# The site generator. It reads `mkdocs.yml`, and carries the theme, the search
# index and the renderer in one package, which is what retired mkdocs,
# mkdocs-material and three plugins nothing configured.
#
# Pinned exactly, for the reason ruff and pyrefly are: this is pre-1.0, and
# what a 0.0.x bump changes is the gate's own output.
zensical = "==0.0.63"
# The Python API pages render through mkdocstrings itself — zensical maps the
# plugin configuration onto it and refuses to build when it is missing. mkdocs
# arrives as a dependency of mkdocstrings and nothing here calls it.
mkdocstrings = ">=0.29"
mkdocstrings-python = ">=1.16"
pymdown-extensions = ">=11.0"
# `python -m zensical`, not the `zensical` console script: the site enables
# `tools.mdx_github_math`, and only `-m` puts the workspace root on `sys.path`
# for python-markdown to import it from. The script form fails the build with
# `No module named 'tools'`.
[feature.docs.tasks.docs-serve]
cmd = "python -m zensical serve"
[feature.docs.tasks.docs-build]
# `--strict` turns every warning into a failure, so this catches a dead
# cross-link and an anchor that stopped resolving. It does not catch a page
# added without a nav entry: zensical validates links and leaves navigation
# alone, so `tests/test_docs.py::test_every_page_under_docs_has_a_nav_entry`
# is what asks that question now.
#
# No `{{ dir }}` argument, because `zensical build` takes no site directory.
# The site lands where `site_dir` in mkdocs.yml says, and `.readthedocs.yml`
# copies it into $READTHEDOCS_OUTPUT from there.
cmd = "python -m zensical build --strict"

# The compile half of the render gate. tectonic rather than a system TeX: it is
# one self-contained binary that pulls the packages a document asks for, so the
# gate installs with `pixi install` and runs on a contributor's laptop. What CI
# did before was `apt-get install texlive-*` in the background of the other
# steps, plus a polling step to collect it — sixty lines of shell in a workflow
# file that nobody could run locally.
#
# It is XeTeX, not pdflatex. The gate asks whether the LaTeX this project emits
# is a real document — balanced, every command defined by a package the
# preamble names — and that is engine-independent.
[feature.tex.dependencies]
tectonic = "*"
[feature.tex.tasks.compile-tex]
cmd = "python -m tools.compile_tex {{ dir }}"
args = [{ arg = "dir", default = "build/tex" }]
depends-on = [{ task = "render-tex", args = ["{{ dir }}"] }]

# The whole gate, in the order a failure is cheapest to read. CI runs these as
# separate steps so a red run names the one that broke; this is the same list
# for anyone who wants to know before pushing.
[tasks.ci]
depends-on = ["lint", "test", "docs-build", "compile-tex"]

[feature.template.dependencies]
copier = ">=9.16"
[feature.template.tasks.template-update]
cmd = "copier update --trust --skip-answered --skip-tasks ."

[feature.py312.dependencies]
python = "3.12.*"
[feature.py313.dependencies]
python = "3.13.*"
[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["test", "build", "lint", "docs", "tex"]
template = ["template"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
