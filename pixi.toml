[workspace]
name = "math-spec"
channels = ["conda-forge"]
exclude-newer = "7d"
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
preview = ["pixi-build"]

[package]
name = "math-spec"
[package.build.backend]
name = "pixi-build-python"
version = "*"
[package.host-dependencies]
python = ">=3.12"
hatchling = "*"
uv = "*"

[dependencies]
math-spec = { path = "." }

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
[feature.test.tasks]
test = "pytest"
test-coverage = "pytest --cov=math_spec --cov-report=xml --cov-report=term-missing"

[feature.build.dependencies]
python = "*"
hatchling = "*"
python-build = "*"
twine = ">=6"
[feature.build.tasks]
build-wheel = "python -m build --no-isolation ."
check-wheel = "twine check dist/*"

[feature.lint.dependencies]
lefthook = "*"
ruff = "*"
pyrefly = "*"
prettier = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
zizmor = "*"
reuse = "*"
[feature.lint.tasks]
pre-commit-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"

[feature.docs.dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5"
mkdocstrings = ">=0.29"
mkdocstrings-python = ">=1.16"
mkdocs-bibtex = ">=2.16"
pymdown-extensions = ">=10.0"
mkdocs-macros-plugin = ">=1.0"
mkdocs-table-reader-plugin = ">=3.1"
[feature.docs.tasks.docs-serve]
cmd = "mkdocs serve"
[feature.docs.tasks.docs-build]
# `{{ dir }}` is pixi's own arg template and must reach pixi intact. The
# upstream copier template writes it in a .jinja file without a `raw` block, so
# copier interpolates it at generation and every repo built from the template
# gets `-d /html` — an absolute path, and `$READTHEDOCS_OUTPUT` silently
# ignored. LOCAL DEVIATION until that is fixed upstream; see RELEASING.md.
#
# `--strict` turns every mkdocs warning into a failure, so a dead cross-link, a
# page missing from the nav, or an anchor that stopped resolving fails the gate
# rather than scrolling past in the build log.
cmd = "mkdocs build --strict -d {{ dir }}/html"
args = ["dir"]

[tasks.render-tex]
# The LaTeX half of "every model renders to something that compiles". The Typst
# half is proven by the suite, which compiles it through a pip wheel; LaTeX
# needs a toolchain, so CI installs a minimal TeX and runs `pdflatex` over what
# this writes.
cmd = "python -m tools.render_tex {{ dir }}"
args = [{ arg = "dir", default = "build/tex" }]

[feature.template.dependencies]
copier = ">=9.16"
[feature.template.tasks.template-update]
cmd = "copier update --trust --skip-answered --skip-tasks ."

[feature.py312.dependencies]
python = "3.12.*"
[feature.py313.dependencies]
python = "3.13.*"
[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["test", "build", "lint", "docs"]
template = ["template"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
