description: >-
  A plain `n.optimize()`, and its multi-period and stochastic classes, in one
  file. Every second-stage quantity spans a `scenario` (a future dispatch is
  chosen in) and every asset stands in the investment `period`s its build year
  and lifetime span. Capacity is chosen once, before the future is known, and
  paid once per active period; operation is the expectation over the scenarios'
  weights, with a share priced at the tail through the CVaR rows, which stand
  only where that share is positive. A plain run feeds one scenario, one period, all-active masks and unit weights, and the
  model collapses to the standard one. A security-constrained run copies each
  branch flow limit once per outage in an `outage` set that a plain run leaves
  empty. Which snapshots an asset is active in, a scenario's weight, and the
  outage factors are data prep.

dimensions:
  scenario:
    description: the futures dispatch is chosen in, each with a weight
  snapshot:
    description: dispatch periods
    dtype: datetime
  bus:
    description: network nodes
  generator:
    description: generating units, each on one bus
  link:
    description: controllable connections, each from one bus to the buses it delivers to
  link_output:
    description: >-
      a link's output ports, one label per port a link declares — PyPSA's
      `bus1`, `bus2`, … columns read long, so a link of any number of output
      ports is one term in the balance, data prep
  process:
    description: generalized multi-port converters, each with an internal power that every port draws or delivers at its own rate
  process_output:
    description: >-
      a process's ports, one label per port a process declares — PyPSA's
      `bus0`, `bus1`, … each carry a signed `rate`, so a process of any number
      of ports is one term in the balance, data prep
  load:
    description: demands, each on one bus
  storage_unit:
    description: storage units, dispatch and store behind one bus connection
  store:
    description: pure energy stores, each on one bus
  line:
    description: passive branches, each between two buses, their flow set by impedance
  transformer:
    description: passive branches between two buses, their flow set by impedance and tap ratio, with a phase shift fixed or optimised
  cycle:
    description: independent cycles of the passive network graph — the cycle basis, data prep
  outage:
    description: >-
      the passive branches a security-constrained run takes out one at a time
      — PyPSA's `branch_outages`, each a line or a transformer; none on a
      plain run
  segment:
    description: >-
      the cuts a passive branch's loss curve is held above — PyPSA's tangents,
      as many as its `segments` count, or its secants, as many as its tolerance
      loop places; none in a lossless run
    dtype: int
  global_constraint:
    description: PyPSA's `GlobalConstraint` rows, one label per declared limit
  period:
    description: investment periods — PyPSA's `investment_periods`
    dtype: int
  carrier:
    description: energy carriers, what a growth limit is set per

parameters:
  snapshot_weightings_objective:
    description: PyPSA's `snapshot_weightings.objective` — hours a snapshot stands for in the cost
    dims: [snapshot]
  Generator_p_nom:
    description: nominal power
    dims: [generator]
  Generator_p_nom_extendable:
    description: whether the nominal power is a decision
    dims: [generator]
    dtype: bool
  Generator_p_min_pu:
    description: least output, per unit of nominal power
    dims: [snapshot, generator]
  Generator_p_max_pu:
    description: most output, per unit of nominal power — an availability profile
    dims: [snapshot, generator]
  Generator_marginal_cost:
    description: cost of one unit of output
    dims: [snapshot, generator]
  Generator_marginal_cost_quadratic:
    description: cost of the square of one unit of output
    dims: [snapshot, generator]
  Generator_committable:
    description: whether output is gated by an on/off status decision
    dims: [generator]
    dtype: bool
  Generator_ramp_limit_up:
    description: most a generator may raise its output between snapshots, per unit of nominal power; no value means no limit
    dims: [generator]
  Generator_ramp_limit_down:
    description: most a generator may lower its output between snapshots, per unit of nominal power; no value means no limit
    dims: [generator]
  Generator_ramp_limit_start_up:
    description: most output in the snapshot a unit starts, per unit of nominal power
    dims: [generator]
  Generator_ramp_limit_shut_down:
    description: most output in the snapshot before a unit stops, per unit of nominal power
    dims: [generator]
  Generator_min_up_time:
    description: least snapshots a unit stays on once started
    dims: [generator]
    dtype: int
  Generator_min_down_time:
    description: least snapshots a unit stays off once stopped
    dims: [generator]
    dtype: int
  Generator_status_initial:
    description: one where the unit was on before the first snapshot, zero where off — PyPSA's `up_time_before > 0`, data prep
    dims: [generator]
    dtype: int
  Generator_must_stay_up:
    description: >-
      true while the up time a unit brought into the horizon still binds —
      data prep, since `position()` compares against a literal rather than a
      parameter
    dims: [snapshot, generator]
    dtype: bool
  Generator_must_stay_down:
    description: >-
      true while the down time a unit brought into the horizon still binds —
      PyPSA's `min_down_time - down_time_before` snapshots, where
      `down_time_before > 0`, data prep for the same reason
    dims: [snapshot, generator]
    dtype: bool
  Generator_start_up_cost:
    description: cost of one start
    dims: [generator]
  Generator_shut_down_cost:
    description: cost of one stop
    dims: [generator]
  Generator_stand_by_cost:
    description: cost of one snapshot spent on
    dims: [snapshot, generator]
  Generator_p_nom_mod:
    description: the module size a build comes in whole numbers of; no value means the build is continuous
    dims: [generator]
  Generator_modules_installed:
    description: >-
      how many whole modules a committable build has in place: `Generator_p_nom
      / Generator_p_nom_mod` where a fixed build is modular, one where it is
      not, data prep. PyPSA refuses a fixed modular build whose nominal power
      is not a whole number of modules
    dims: [generator]
  Generator_big_m:
    description: a bound safely above any feasible output — the build cap at full availability, data prep
    dims: [generator]
  Generator_p_min_pu_nonneg:
    description: >-
      true where none of the generator's own minimums-per-unit is negative —
      PyPSA's per-unit `(p_min_pu >= 0).all()`, data prep
    dims: [generator]
    dtype: bool
  Generator_maintainable:
    description: whether a generator must be taken off for maintenance within the horizon
    dims: [generator]
    dtype: bool
  Generator_maintenance_pu:
    description: the share of the build a maintenance event takes off
    dims: [generator]
  Generator_maintenance_events:
    description: how many maintenance events the horizon holds
    dims: [generator]
    dtype: int
  Generator_maintenance_duration:
    description: >-
      the hours of generator weightings one maintenance event covers —
      PyPSA's `maintenance_duration`; no value where the generator is not
      maintainable. No row reads it: data prep turns it into
      `Generator_maintenance_cover` and `Generator_maintenance_start_blocked`, and the
      assumptions hold it to the horizon
    dims: [generator]
  Generator_maintenance_start_blocked:
    description: >-
      true where no maintenance event may start, because the snapshots it
      would cover run past the end of the horizon or into one the generator does
      not stand in — PyPSA's `active & ~valid`, from `maintenance_duration`
      and the generator weightings, data prep
    dims: [snapshot, generator]
    dtype: bool
  Link_ramp_limit_up:
    description: most a link may raise its flow between snapshots, per unit of nominal power; no value means no limit
    dims: [link]
  Link_ramp_limit_down:
    description: most a link may lower its flow between snapshots, per unit of nominal power; no value means no limit
    dims: [link]
  Link_p_nom:
    description: nominal power
    dims: [link]
  Link_p_nom_extendable:
    description: whether the nominal power is a decision
    dims: [link]
    dtype: bool
  Link_p_min_pu:
    description: least flow, per unit of nominal power — negative for a link that carries both ways
    dims: [snapshot, link]
  Link_p_max_pu:
    description: most flow, per unit of nominal power
    dims: [snapshot, link]
  Link_efficiency:
    description: >-
      share of the flow that arrives at an output port, PyPSA's `efficiency`,
      `efficiency2`, … read long — negative where that port consumes rather
      than delivers
    dims: [link_output]
  Link_output_delay:
    description: >-
      snapshots a port's delivery lags its link's flow — PyPSA's `delay`,
      `delay2`, … read long, in `snapshot_weightings.generators` units, which
      the file states as whole snapshots; zero for a port that delivers at once
    dims: [link_output]
    dtype: int
  Link_output_cyclic_delay:
    description: >-
      whether a delayed port's flow wraps from the end of its investment
      period — PyPSA's `cyclic_delay`, `cyclic_delay2`, …; where it does not,
      the flow still in transit at each period's first snapshots is lost
    dims: [link_output]
    dtype: bool
  Link_marginal_cost:
    description: cost of one unit of flow
    dims: [snapshot, link]
  Link_marginal_cost_quadratic:
    description: cost of the square of one unit of flow
    dims: [snapshot, link]
  Link_committable:
    description: whether flow is gated by an on/off status decision
    dims: [link]
    dtype: bool
  Link_ramp_limit_start_up:
    description: most flow in the snapshot a link starts, per unit of nominal power
    dims: [link]
  Link_ramp_limit_shut_down:
    description: most flow in the snapshot before a link stops, per unit of nominal power
    dims: [link]
  Link_min_up_time:
    description: least snapshots a link stays on once started
    dims: [link]
    dtype: int
  Link_min_down_time:
    description: least snapshots a link stays off once stopped
    dims: [link]
    dtype: int
  Link_status_initial:
    description: one where the link was on before the first snapshot, zero where off — PyPSA's `up_time_before > 0`, data prep
    dims: [link]
    dtype: int
  Link_must_stay_up:
    description: >-
      true while the up time a link brought into the horizon still binds —
      data prep, since `position()` compares against a literal rather than a
      parameter
    dims: [snapshot, link]
    dtype: bool
  Link_must_stay_down:
    description: >-
      true while the down time a link brought into the horizon still binds —
      PyPSA's `min_down_time - down_time_before` snapshots, where
      `down_time_before > 0`, data prep for the same reason
    dims: [snapshot, link]
    dtype: bool
  Link_start_up_cost:
    description: cost of one start
    dims: [link]
  Link_shut_down_cost:
    description: cost of one stop
    dims: [link]
  Link_stand_by_cost:
    description: cost of one snapshot spent on
    dims: [snapshot, link]
  Link_p_nom_mod:
    description: the module size a build comes in whole numbers of; no value means the build is continuous
    dims: [link]
  Link_modules_installed:
    description: >-
      how many whole modules a committable build has in place: `Link_p_nom
      / Link_p_nom_mod` where a fixed build is modular, one where it is
      not, data prep. PyPSA refuses a fixed modular build whose nominal power
      is not a whole number of modules
    dims: [link]
  Link_big_m:
    description: a bound safely above any feasible flow — the build cap at full availability, data prep
    dims: [link]
  Link_p_min_pu_nonneg:
    description: >-
      true where none of the link's own minimums-per-unit is negative —
      PyPSA's per-unit `(p_min_pu >= 0).all()`, data prep
    dims: [link]
    dtype: bool
  Link_maintainable:
    description: whether a link must be taken off for maintenance within the horizon
    dims: [link]
    dtype: bool
  Link_maintenance_pu:
    description: the share of the build a maintenance event takes off
    dims: [link]
  Link_maintenance_events:
    description: how many maintenance events the horizon holds
    dims: [link]
    dtype: int
  Link_maintenance_duration:
    description: >-
      the hours of generator weightings one maintenance event covers —
      PyPSA's `maintenance_duration`; no value where the link is not
      maintainable. No row reads it: data prep turns it into
      `Link_maintenance_cover` and `Link_maintenance_start_blocked`, and the
      assumptions hold it to the horizon
    dims: [link]
  Link_maintenance_start_blocked:
    description: >-
      true where no maintenance event may start, because the snapshots it
