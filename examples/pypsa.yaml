    dims: [storage_unit]
  StorageUnit_capital_cost:
    description: cost of one unit of nominal power — PyPSA's `capital_cost`, periodized as an annuity in data prep
    dims: [storage_unit]
  StorageUnit_p_nom_set:
    description: a given nominal power for an extendable storage unit; one without a value has no row here
    dims: [storage_unit]
  Store_e_nom_min:
    description: least nominal capacity an extendable store may be built at
    dims: [store]
  Store_e_nom_max:
    description: most nominal capacity an extendable store may be built at
    dims: [store]
  Store_capital_cost:
    description: cost of one unit of nominal capacity — PyPSA's `capital_cost`, periodized as an annuity in data prep
    dims: [store]
  Store_e_nom_set:
    description: a given nominal capacity for an extendable store; one without a value has no row here
    dims: [store]
  StorageUnit_p_nom:
    description: nominal power
    dims: [storage_unit]
  StorageUnit_p_nom_extendable:
    description: whether the nominal power is a decision
    dims: [storage_unit]
    dtype: bool
  StorageUnit_p_min_pu:
    description: most storing, per unit of nominal power and negated
    dims: [snapshot, storage_unit]
  StorageUnit_p_max_pu:
    description: most dispatch, per unit of nominal power
    dims: [snapshot, storage_unit]
  StorageUnit_max_hours:
    description: energy capacity, as hours of dispatch at nominal power
    dims: [storage_unit]
  StorageUnit_efficiency_store:
    description: share of the power drawn from the bus that becomes charge
    dims: [storage_unit]
  StorageUnit_efficiency_dispatch:
    description: share of the charge drawn down that reaches the bus
    dims: [storage_unit]
  StorageUnit_retention:
    description: share of charge kept over a snapshot — PyPSA's `(1 - standing_loss) ** elapsed hours`, data prep
    dims: [snapshot, storage_unit]
  StorageUnit_inflow:
    description: energy arriving per hour, a river into a reservoir
    dims: [snapshot, storage_unit]
  StorageUnit_state_of_charge_initial:
    description: charge held before the first snapshot
    dims: [storage_unit]
  StorageUnit_cyclic_state_of_charge:
    description: whether the horizon closes on itself instead of opening on the initial charge
    dims: [storage_unit]
    dtype: bool
  StorageUnit_cyclic_state_of_charge_per_period:
    description: >-
      whether each investment period closes on itself instead of carrying its
      charge on to the next; it overrides `cyclic_state_of_charge` and
      `state_of_charge_initial_per_period`. PyPSA reads it only under
      `multi_investment_periods`, so data prep feeds false otherwise
    dims: [storage_unit]
    dtype: bool
  StorageUnit_state_of_charge_initial_per_period:
    description: >-
      whether each investment period opens on the initial charge instead of
      carrying the previous period's; PyPSA reads it only under
      `multi_investment_periods`, so data prep feeds false otherwise
    dims: [storage_unit]
    dtype: bool
  StorageUnit_opens_late:
    description: >-
      whether a snapshot is the first a storage unit stands in, where that is
      not the first of the horizon — PyPSA's `active.cumsum() == 1` past the
      first snapshot, data prep; false in a run where every unit stands throughout
    dims: [snapshot, storage_unit]
    dtype: bool
  StorageUnit_inactive_snapshots:
    description: >-
      how many snapshots a storage unit does not stand in — PyPSA's
      `(~active).sum()`, data prep. A cyclic unit reaches back this many
      snapshots further, so it closes on the last snapshot it stands in
    dims: [storage_unit]
    dtype: int
  StorageUnit_marginal_cost:
    description: cost of one unit of dispatch
    dims: [snapshot, storage_unit]
  StorageUnit_marginal_cost_quadratic:
    description: cost of the square of one unit of dispatch; storing is not charged
    dims: [snapshot, storage_unit]
  StorageUnit_marginal_cost_storage:
    description: cost of one unit of charge held over one snapshot
    dims: [snapshot, storage_unit]
  StorageUnit_spill_cost:
    description: cost of one unit of inflow passed on unused
    dims: [snapshot, storage_unit]
  StorageUnit_p_set:
    description: a given net dispatch schedule; a unit without one has no row here
    dims: [snapshot, storage_unit]
  StorageUnit_p_dispatch_set:
    description: a given dispatch schedule; a unit without one has no row here
    dims: [snapshot, storage_unit]
  StorageUnit_p_store_set:
    description: a given charging schedule; a unit without one has no row here
    dims: [snapshot, storage_unit]
  StorageUnit_state_of_charge_set:
    description: a given charge schedule; a unit without one has no row here
    dims: [snapshot, storage_unit]
  Store_e_nom:
    description: nominal energy capacity
    dims: [store]
  Store_e_nom_extendable:
    description: whether the nominal energy capacity is a decision
    dims: [store]
    dtype: bool
  Store_e_min_pu:
    description: least energy held, per unit of nominal capacity — negative for a store that may go short
    dims: [snapshot, store]
  Store_e_max_pu:
    description: most energy held, per unit of nominal capacity
    dims: [snapshot, store]
  Store_retention:
    description: share of energy kept over a snapshot — PyPSA's `(1 - standing_loss) ** elapsed hours`, data prep
    dims: [snapshot, store]
  Store_e_initial:
    description: energy held before the first snapshot
    dims: [store]
  Store_e_cyclic:
    description: whether the horizon closes on itself instead of opening on the initial energy
    dims: [store]
    dtype: bool
  Store_e_cyclic_per_period:
    description: >-
      whether each investment period closes on itself instead of carrying its
      energy on to the next; it overrides `e_cyclic` and `e_initial_per_period`.
      PyPSA reads it only under `multi_investment_periods`, so data prep feeds
      false otherwise
    dims: [store]
    dtype: bool
  Store_e_initial_per_period:
    description: >-
      whether each investment period opens on the initial energy instead of
      carrying the previous period's; PyPSA reads it only under
      `multi_investment_periods`, so data prep feeds false otherwise
    dims: [store]
    dtype: bool
  Store_opens_late:
    description: >-
      whether a snapshot is the first a store stands in, where that is not the
      first of the horizon — PyPSA's `active.cumsum() == 1` past the first
      snapshot, data prep; false in a run where every store stands throughout
    dims: [snapshot, store]
    dtype: bool
  Store_inactive_snapshots:
    description: >-
      how many snapshots a store does not stand in — PyPSA's `(~active).sum()`,
      data prep. A cyclic store reaches back this many snapshots further, so it
      closes on the last snapshot it stands in
    dims: [store]
    dtype: int
  Store_marginal_cost:
    description: cost of one unit of power delivered
    dims: [snapshot, store]
  Store_marginal_cost_quadratic:
    description: cost of the square of the net power delivered, so charging costs as much as delivering
    dims: [snapshot, store]
  Store_marginal_cost_storage:
    description: cost of one unit of energy held over one snapshot
    dims: [snapshot, store]
  Store_e_set:
    description: a given energy schedule; a store without one has no row here
    dims: [snapshot, store]
  Store_p_set:
    description: a given schedule of power delivered; a store without one has no row here
    dims: [snapshot, store]
  Line_s_nom:
    description: nominal apparent power
    dims: [line]
  Line_s_nom_extendable:
    description: whether the nominal apparent power is a decision
    dims: [line]
    dtype: bool
  Line_s_max_pu:
    description: most flow either way, per unit of nominal apparent power
    dims: [snapshot, line]
  Line_s_nom_min:
    description: least nominal apparent power an extendable line may be built at
    dims: [line]
  Line_s_nom_max:
    description: most nominal apparent power an extendable line may be built at
    dims: [line]
  Line_capital_cost:
    description: cost of one unit of nominal apparent power — PyPSA's `capital_cost`, periodized as an annuity in data prep
    dims: [line]
  Line_s_nom_set:
    description: a given nominal apparent power for an extendable line; one without a value has no row here
    dims: [line]
  Line_s_set:
    description: a given flow schedule; a line without one has no row here
    dims: [snapshot, line]
  Line_cycle_weight:
    description: >-
      the line's series impedance, signed by its orientation in the cycle —
      the cycle basis, data prep; a line in no cycle has no row
    dims: [line, cycle]
  Line_BODF:
    description: >-
      the share of an outaged branch's flow a line takes on when that branch
      goes out — PyPSA's `BODF`, from the sub-network's PTDF, data prep; a row
      only where the line and the outage share a sub-network, -1 at the
      outaged line itself
    dims: [line, outage]
  transmission_losses:
    description: >-
      whether the network dissipates transmission losses — PyPSA's
      `transmission_losses` read as a flag; its mode, tangents or secants,
      only decides how data prep fills the `segment` axis, the rows are the
      same; false with no segments is a lossless run
    dims: []
    dtype: bool
  Line_loss_max:
    description: the loss at a line's rating — PyPSA's `r_pu_eff * (s_max_pu * s_nom_max)**2`, data prep
    dims: [snapshot, line]
  Line_loss_slope:
    description: >-
      the slope of a cut to the loss curve — a tangent's `2 * r_pu_eff * p_k`
      at its segment's flow, a secant's `r_pu_eff * (p_k + p_k+1)` between
      consecutive breakpoints, data prep
    dims: [snapshot, line, segment]
  Line_loss_offset:
    description: >-
      where that cut meets the loss axis — a tangent's `loss_k - slope_k * p_k`,
      a secant's `-r_pu_eff * p_k * p_k+1`, negative, data prep
    dims: [snapshot, line, segment]
  Transformer_s_nom:
    description: nominal apparent power
    dims: [transformer]
  Transformer_s_nom_extendable:
    description: whether the nominal apparent power is a decision
    dims: [transformer]
    dtype: bool
  Transformer_s_max_pu:
    description: most flow either way, per unit of nominal apparent power
    dims: [snapshot, transformer]
  Transformer_s_nom_min:
    description: least nominal apparent power an extendable transformer may be built at
    dims: [transformer]
  Transformer_s_nom_max:
    description: most nominal apparent power an extendable transformer may be built at
    dims: [transformer]
  Transformer_capital_cost:
    description: cost of one unit of nominal apparent power — PyPSA's `capital_cost`, periodized as an annuity in data prep
    dims: [transformer]
  Transformer_s_nom_set:
    description: a given nominal apparent power for an extendable transformer; one without a value has no row here
    dims: [transformer]
  Transformer_s_set:
    description: a given flow schedule; a transformer without one has no row here
    dims: [snapshot, transformer]
  Transformer_cycle_weight:
    description: >-
      the transformer's effective series reactance, `x` times its tap ratio,
      signed by its orientation in the cycle — PyPSA's `x_pu_eff`, the cycle
      basis, data prep; a transformer in no cycle has no row
    dims: [transformer, cycle]
  Transformer_BODF:
    description: >-
      the share of an outaged branch's flow a transformer takes on when that
      branch goes out, as a line's; a row only where the transformer and the
      outage share a sub-network
    dims: [transformer, outage]
  Transformer_phase_shift_weight:
    description: >-
      a fixed transformer's phase shift in radians, signed by its orientation
      in the cycle — a constant added to the cycle sum, data prep; zero for a
      varying transformer, whose shift is a decision instead, so the constant and
      the variable term never both count a shift. A transformer with no shift or
      in no cycle has no row
    dims: [transformer, cycle]
  Transformer_phase_shift_varying:
    description: >-
      whether a transformer's phase shift is a decision — PyPSA's
      `phase_shift_min < phase_shift_max`, read as a flag in data prep; false is a
      fixed shift carried by `phase_shift`
    dims: [transformer]
    dtype: bool
  Transformer_phase_shift_min:
    description: >-
      the least a varying transformer's phase shift may take, in degrees —
      PyPSA's `phase_shift_min`; where it is below `phase_shift_max` the shift is
      a decision, otherwise the transformer keeps its fixed `phase_shift`
    dims: [transformer]
  Transformer_phase_shift_max:
    description: >-
      the most a varying transformer's phase shift may take, in degrees —
      PyPSA's `phase_shift_max`; equal to `phase_shift_min` for a fixed transformer
    dims: [transformer]
  Transformer_phase_shift_cycle_weight:
    description: >-
      the cycle sign for a varying transformer's phase shift, times π/180 so a
      shift in degrees enters the cycle sum in radians — data prep; zero for a
      fixed transformer or one in no cycle
    dims: [transformer, cycle]
  Transformer_loss_max:
    description: >-
      the loss at a transformer's rating — PyPSA's `r_pu_eff * (s_max_pu *
      s_nom_max)**2`, its `r_pu_eff` the resistance over the given `s_nom` times
      the tap ratio, data prep
    dims: [snapshot, transformer]
  Transformer_loss_slope:
    description: >-
      the slope of a cut to a transformer's loss curve — a tangent's
      `2 * r_pu_eff * p_k`, a secant's `r_pu_eff * (p_k + p_k+1)`, as a line's,
      over the transformer's own `r_pu_eff` and rating, data prep
    dims: [snapshot, transformer, segment]
  Transformer_loss_offset:
    description: >-
      where that cut meets the loss axis — a tangent's `loss_k - slope_k * p_k`,
      a secant's `-r_pu_eff * p_k * p_k+1`, negative, data prep
    dims: [snapshot, transformer, segment]
  GlobalConstraint_type:
    description: >-
      which formula the row takes — `primary_energy`, `operational_limit`,
      `transmission_volume_expansion_limit`,
      `transmission_expansion_cost_limit` or
      `tech_capacity_expansion_limit`
    dims: [global_constraint]
    dtype: str
  GlobalConstraint_sense:
    description: which way the row binds — `<=`, `>=` or `==`
    dims: [global_constraint]
    dtype: str
  GlobalConstraint_constant:
    description: >-
      the constant the total is held against; what a variable cannot carry —
      an initial charge, times its period's years for each counted period
      where the storage reopens per period, or a non-extendable build — is
      folded in here by data prep
    dims: [global_constraint]
  GlobalConstraint_counts_snapshot:
    description: >-
      whether a row counts a snapshot — PyPSA's `investment_period`: every
      snapshot where the row names none, and only that period's where it
      names one, data prep. A row that names a period the run does not model
      has no label here, as PyPSA skips it (`global_constraints.py:377`);
      PyPSA reads the column only under `multi_investment_periods`, and fails
      on a row that names a period without it (`global_constraints.py:375`)
    dims: [global_constraint, snapshot]
    dtype: bool
  Generator_primary_energy_weight:
    description: >-
      the constrained attribute per unit of energy at the bus — the carrier's
      `co2_emissions` over the generator's efficiency, data prep; a generator
      of an unweighted carrier has no row
    dims: [global_constraint, generator]
  StorageUnit_primary_energy_weight:
    description: the constrained attribute per unit of charge depleted — data prep; an unweighted unit has no row
    dims: [global_constraint, storage_unit]
  Store_primary_energy_weight:
    description: the constrained attribute per unit of energy depleted — data prep; an unweighted store has no row
    dims: [global_constraint, store]
  Generator_operational_limit_weight:
    description: one where the generator is in the row's set — data prep; one outside it has no row
    dims: [global_constraint, generator]
  StorageUnit_operational_limit_weight:
    description: one where the storage unit is in the row's set — data prep; one outside it has no row
    dims: [global_constraint, storage_unit]
  Store_operational_limit_weight:
    description: one where the store is in the row's set — data prep; one outside it has no row
    dims: [global_constraint, store]
  Line_volume_weight:
    description: >-
      the line's length where its carrier is in the row's set — data prep; a
      line outside it, or one that does not stand in the row's
      `investment_period`, has no row
    dims: [global_constraint, line]
  Link_volume_weight:
    description: >-
      the link's length where its carrier is in the row's set — data prep; a
      link outside it, or one that does not stand in the row's
      `investment_period`, has no row
    dims: [global_constraint, link]
  Line_expansion_cost_weight:
    description: >-
      the line's capital cost where its carrier is in the row's set, times
      the objective weights of the periods it stands in where the row names
      no `investment_period` under `multi_investment_periods` — data prep; a
      line outside the set, or one that does not stand in the row's period,
      has no row
    dims: [global_constraint, line]
  Link_expansion_cost_weight:
    description: >-
      the link's capital cost where its carrier is in the row's set, times
      the objective weights of the periods it stands in where the row names
      no `investment_period` under `multi_investment_periods` — data prep; a
      link outside the set, or one that does not stand in the row's period,
      has no row
    dims: [global_constraint, link]
  Generator_tech_capacity_weight:
    description: >-
      one where the generator is in the row's carrier-and-bus set — data
      prep; one outside it, or one that does not stand in the row's
      `investment_period`, has no row
    dims: [global_constraint, generator]
  Link_tech_capacity_weight:
    description: >-
      one where the link is in the row's carrier-and-bus set — data prep; one
      outside it, or one that does not stand in the row's `investment_period`,
      has no row
    dims: [global_constraint, link]
  Line_tech_capacity_weight:
    description: >-
      one where the line is in the row's carrier-and-bus set — data prep; one
      outside it, or one that does not stand in the row's `investment_period`,
      has no row
    dims: [global_constraint, line]
  StorageUnit_tech_capacity_weight:
    description: >-
      one where the storage unit is in the row's carrier-and-bus set — data prep; one
      outside it, or one that does not stand in the row's `investment_period`,
      has no row
    dims: [global_constraint, storage_unit]
  Store_tech_capacity_weight:
    description: >-
      one where the store is in the row's carrier-and-bus set — data prep; one
      outside it, or one that does not stand in the row's `investment_period`,
      has no row
    dims: [global_constraint, store]
  Process_tech_capacity_weight:
    description: >-
      one where the process is in the row's carrier-and-bus set — data prep; one
      outside it, or one that does not stand in the row's `investment_period`,
      has no row
    dims: [global_constraint, process]

relations:
  snapshot_period:
    description: the investment period a snapshot falls in
    key: snapshot
    values: period
  Generator_carrier:
    description: the carrier a generator converts from
    key: generator
    values: carrier
  Generator_bus:
    description: the bus a generator sits on
    key: generator
    values: bus
  Link_carrier:
    description: the carrier a link converts from
    key: link
    values: carrier
  Link_bus0:
    description: the bus a link leaves
    key: link
    values: bus
  Link_output_link:
    description: the link an output port belongs to
    key: link_output
    values: link
  Link_output_bus:
    description: >-
      the bus an output port delivers to — PyPSA's `bus1`, `bus2`, … columns.
      A link of three output ports is three labels here rather than a third
      relation, so the file states any number of them
    key: link_output
    values: bus
  Process_carrier:
    description: the carrier a process converts from
    key: process
    values: carrier
  Process_output_process:
    description: the process a port belongs to
    key: process_output
    values: process
  Process_output_bus:
    description: >-
      the bus a port draws from or delivers to — PyPSA's `bus0`, `bus1`, …
      columns. A process of three ports is three labels here rather than a
      third relation, so the file states any number of them
    key: process_output
    values: bus
  Load_bus:
    description: the bus a load sits on
    key: load
    values: bus
  StorageUnit_carrier:
    description: the carrier a storage unit converts from
    key: storage_unit
    values: carrier
  StorageUnit_bus:
    description: the bus a storage unit sits on
    key: storage_unit
    values: bus
  Line_carrier:
    description: the carrier a line carries
    key: line
    values: carrier
  Line_bus0:
    description: the bus a line's flow is measured at
    key: line
    values: bus
  Line_bus1:
    description: the bus at a line's other end
    key: line
    values: bus
  Store_carrier:
    description: the carrier a store holds
    key: store
    values: carrier
  Store_bus:
    description: the bus a store sits on
    key: store
    values: bus
  Transformer_bus0:
    description: the bus a transformer's flow is measured at
    key: transformer
    values: bus
  Transformer_bus1:
    description: the bus at a transformer's other end
    key: transformer
    values: bus
  Outage_line:
    description: the line an outage takes out; an outage of a transformer has no row
    key: outage
    values: line
  Outage_transformer:
    description: the transformer an outage takes out; an outage of a line has no row
    key: outage
    values: transformer
  Generator_maintenance_cover:
    description: >-
      the snapshots a maintenance event covers, by the snapshot it starts in —
      the start and the snapshots after it, until their generator weightings
      reach `maintenance_duration`, data prep; no rows for a generator that is
      not maintainable
    key: { generator: generator, start: snapshot, covered: snapshot }
  Link_maintenance_cover:
    description: >-
      the snapshots a maintenance event covers, by the snapshot it starts in —
      the start and the snapshots after it, until their generator weightings
      reach `maintenance_duration`, data prep; no rows for a link that is
      not maintainable
    key: { link: link, start: snapshot, covered: snapshot }
  Process_maintenance_cover:
    description: >-
      the snapshots a maintenance event covers, by the snapshot it starts in —
      the start and the snapshots after it, until their generator weightings
      reach `maintenance_duration`, data prep; no rows for a process that is
      not maintainable
    key: { process: process, start: snapshot, covered: snapshot }

variables:
  Generator_p:
    description: "`Generator-p` — output of a generator in a snapshot"
    dims: [scenario, snapshot, generator]
    where: Generator_active
  Link_p:
    description: >-
      `Link-p` — PyPSA's `p0`, the flow measured at the `Link_bus0` end: a
      positive value withdraws there and injects at every bus the link's
      output ports deliver to
    dims: [scenario, snapshot, link]
    where: Link_active
  Process_p:
    description: >-
      `Process-p` — PyPSA's internal power `p`: a positive value drives every
      port at its own rate, withdrawing where the rate is negative and injecting
      where it is positive
    dims: [scenario, snapshot, process]
    where: Process_active
  StorageUnit_p_dispatch:
    description: "`StorageUnit-p_dispatch` — power delivered to the bus"
    dims: [scenario, snapshot, storage_unit]
    where: StorageUnit_active
  StorageUnit_p_store:
    description: "`StorageUnit-p_store` — power drawn from the bus into charge"
    dims: [scenario, snapshot, storage_unit]
    where: StorageUnit_active
  StorageUnit_state_of_charge:
    description: "`StorageUnit-state_of_charge` — energy held at the end of a snapshot"
    dims: [scenario, snapshot, storage_unit]
    where: StorageUnit_active
  StorageUnit_spill:
    description: >-
      `StorageUnit-spill` — inflow passed on unused. Zero where there is no
      inflow, so the balance keeps its row there; the bounds are PyPSA's, on
      the variable rather than as rows
    dims: [scenario, snapshot, storage_unit]
    where: "StorageUnit_inflow > 0 AND StorageUnit_active"
    absence: zero
    bounds:
      lower: 0
      upper: StorageUnit_inflow
  Store_e:
    description: "`Store-e` — energy held at the end of a snapshot"
    dims: [scenario, snapshot, store]
    where: Store_active
  Store_p:
    description: "`Store-p` — power delivered to the bus; charging is negative"
    dims: [scenario, snapshot, store]
    where: Store_active
  Generator_n_mod:
    description: "`Generator-n_mod` — how many modules of an extendable modular build"
    dims: [generator]
    where: Generator_p_nom_extendable AND Generator_p_nom_mod > 0
    domain: integer
    bounds:
      lower: 0
  Generator_status:
    description: >-
      `Generator-status` — how much of a committable unit is on: an integer
      the rows below cap at one, or at the module count where the build is
      modular
    dims: [scenario, snapshot, generator]
    where: Generator_committable AND Generator_active
    domain: integer
    bounds:
      lower: 0
  Generator_start_up:
    description: "`Generator-start_up` — how much of a committable unit turns on this snapshot, capped as the status is"
    dims: [scenario, snapshot, generator]
    where: Generator_committable AND Generator_active
    domain: integer
    bounds:
      lower: 0
  Generator_shut_down:
    description: "`Generator-shut_down` — how much of a committable unit turns off this snapshot, capped as the status is"
    dims: [scenario, snapshot, generator]
    where: Generator_committable AND Generator_active
    domain: integer
    bounds:
      lower: 0
  Generator_maintenance:
    description: >-
      `Generator-maintenance` — whether a maintainable generator is in maintenance:
