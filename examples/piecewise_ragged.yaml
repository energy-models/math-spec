description: >-
  The same least-cost dispatch as `piecewise_lp.yaml`, with curves of different
  lengths. A large unit is metered at every breakpoint and a small one at the
  first few, so the breakpoint table is ragged. A `where:` reading `bp` is what
  says how far each curve runs: without it every curve claims the whole axis,
  and a breakpoint with no row is read as a zero rather than as a shorter curve
  — which sits the curve on the origin instead of ending it.

dimensions:
  snapshot:
    description: dispatch periods
    dtype: int
  generator:
    description: dispatchable units
    dtype: str
  bp:
    description: breakpoints of the cost curve, as many as the longest curve needs
    dtype: int

parameters:
  capacity:
    description: maximum dispatch
    dims: [generator]
  load:
    description: demand to be met
    dims: [snapshot]
  metered:
    description: >-
      which breakpoints this generator's curve runs through, true over one
      consecutive run starting at the first
    dims: [generator, bp]
    dtype: bool
  bp_x:
    description: breakpoint dispatch levels, bound where `metered` is true
    dims: [generator, bp]
  bp_y:
    description: cost at each breakpoint, bound where `metered` is true
    dims: [generator, bp]

variables:
  dispatch:
    description: dispatched power
    dims: [snapshot, generator]
    bounds:
      lower: 0
      upper: capacity
  op_cost:
    description: operating cost, held above every segment of the generator's curve
    dims: [snapshot, generator]
    bounds:
      lower: 0

piecewise:
  cost_curve:
    description: >-
      a curve per generator, each running only as far as `metered` marks. The
      mask narrows every condition the method states: the breakpoints are
      counted over it, and the increasing and curvature tests are checked
      between admitted neighbours rather than along the whole axis.
    along: bp
    dims: [snapshot, generator]
    where: metered
    links:
      dispatch: [dispatch, bp_x]
      op_cost: [op_cost, bp_y, ">="]
    method: lp

constraints:
  balance:
    dims: [snapshot]
    expression: sum(dispatch, over=generator) == load

objective:
  sense: minimize
  description: total operating cost, taken off the curves rather than from a marginal rate
  expression: sum(op_cost)
