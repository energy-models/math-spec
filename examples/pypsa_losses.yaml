description: >-
  The lossy class of a plain `n.optimize()`: `transmission_losses` in its
  tangent form, stated on rung 6's lines in a file of its own. A line
  dissipates a loss its flow buys along a fan of tangents to the quadratic
  curve, half at either end — a variable and rows the keyword adds, which no
  `where:` can add to `examples/pypsa.yaml`. The fan's slopes and offsets are
  data prep, one per segment.

dimensions:
  snapshot:
    description: dispatch periods
    dtype: datetime
  bus:
    description: network nodes
  generator:
    description: generating units, each on one bus
  link:
    description: controllable connections, each from one bus to the buses it delivers to
  link_output:
    description: >-
      a link's output ports, one label per port a link declares — PyPSA's
      `bus1`, `bus2`, … columns read long, so a link of any number of output
      ports is one term in the balance, data prep
  line:
    description: passive branches, each between two buses, their flow set by impedance
  cycle:
    description: independent cycles of the passive network graph — the cycle basis, data prep
  segment:
    description: the tangents the loss curve is approximated by, PyPSA's `segments`
    dtype: int
  load:
    description: demands, each on one bus

parameters:
  snapshot_weightings_objective:
    description: PyPSA's `snapshot_weightings.objective` — hours a snapshot stands for in the cost
    dims: [snapshot]
  Generator_p_nom:
    description: nominal power
    dims: [generator]
  Generator_p_min_pu:
    description: least output, per unit of nominal power
    dims: [snapshot, generator]
  Generator_p_max_pu:
    description: most output, per unit of nominal power — an availability profile
    dims: [snapshot, generator]
  Generator_marginal_cost:
    description: cost of one unit of output
    dims: [snapshot, generator]
  Line_s_nom:
    description: nominal apparent power
    dims: [line]
  Line_s_nom_extendable:
    description: whether the nominal apparent power is a decision
    dims: [line]
    dtype: bool
  Line_s_max_pu:
    description: most flow either way, per unit of nominal apparent power
    dims: [snapshot, line]
  Line_s_nom_min:
    description: least nominal apparent power an extendable line may be built at
    dims: [line]
  Line_s_nom_max:
    description: most nominal apparent power an extendable line may be built at
    dims: [line]
  Line_capital_cost:
    description: cost of one unit of nominal apparent power — PyPSA's `capital_cost`, periodized as an annuity in data prep
    dims: [line]
  Line_cycle_weight:
    description: >-
      the line's series impedance, signed by its orientation in the cycle —
      the cycle basis, data prep; a line in no cycle has no row
    dims: [line, cycle]
  Line_loss_max:
    description: the loss at a line's rating — PyPSA's `r_pu_eff * (s_max_pu * s_nom_max)**2`, data prep
    dims: [snapshot, line]
  Line_loss_slope:
    description: the slope of a tangent to the loss curve at its segment's flow — `2 * r_pu_eff * p_k`, data prep
    dims: [snapshot, line, segment]
  Line_loss_offset:
    description: where that tangent meets the loss axis — `loss_k - slope_k * p_k`, negative, data prep
    dims: [snapshot, line, segment]
  Link_p_nom:
    description: nominal power
    dims: [link]
  Link_p_min_pu:
    description: least flow, per unit of nominal power — negative for a link that carries both ways
    dims: [snapshot, link]
  Link_p_max_pu:
    description: most flow, per unit of nominal power
    dims: [snapshot, link]
  Link_efficiency:
    description: >-
      share of the flow that arrives at an output port, PyPSA's `efficiency`,
      `efficiency2`, … read long — negative where that port consumes rather
      than delivers
    dims: [link_output]
  Link_marginal_cost:
    description: cost of one unit of flow
    dims: [snapshot, link]
  Load_p_set:
    description: demand
    dims: [snapshot, load]

lookups:
  Generator_bus:
    description: the bus a generator sits on
    over: generator
    into: bus
  Line_bus0:
    description: the bus a line's flow is measured at
    over: line
    into: bus
  Line_bus1:
    description: the bus at a line's other end
    over: line
    into: bus
  Link_bus0:
    description: the bus a link leaves
    over: link
    into: bus
  Link_output_link:
    description: the link an output port belongs to
    over: link_output
    into: link
  Link_output_bus:
    description: >-
      the bus an output port delivers to — PyPSA's `bus1`, `bus2`, … columns.
      A link of three output ports is three labels here rather than a third
      lookup, so the file states any number of them
    over: link_output
    into: bus
  Load_bus:
    description: the bus a load sits on
    over: load
    into: bus

variables:
  Generator_p:
    description: "`Generator-p` — output of a generator in a snapshot"
    foreach: [snapshot, generator]
  Line_s:
    description: >-
      `Line-s` — PyPSA's `p0`, the flow measured at the `Line_bus0` end: a
      positive value withdraws there and injects at `Line_bus1`
    foreach: [snapshot, line]
  Line_s_nom_ext:
    description: >-
      `Line-s_nom` — nominal apparent power where it is a decision; the
      parameter of the same PyPSA name carries the fixed regime
    foreach: [line]
    where: Line_s_nom_extendable
  Link_p:
    description: >-
      `Link-p` — PyPSA's `p0`, the flow measured at the `Link_bus0` end: a
      positive value withdraws there and injects at every bus the link's
      output ports deliver to
    foreach: [snapshot, link]
  Line_loss:
    description: "`Line-loss` — what a line dissipates carrying its flow, pushed down by the cost and held up by the tangents"
    foreach: [snapshot, line]
    bounds:
      lower: 0

constraints:
  Generator_fix_p_lower:
    description: "`Generator-fix-p-lower` — a generator outputs at least its minimum"
    foreach: [snapshot, generator]
    expression: Generator_p >= Generator_p_min_pu * Generator_p_nom
  Generator_fix_p_upper:
    description: "`Generator-fix-p-upper` — a generator outputs at most what is available"
    foreach: [snapshot, generator]
    expression: Generator_p <= Generator_p_max_pu * Generator_p_nom
  Link_fix_p_lower:
    description: "`Link-fix-p-lower` — a link carries at least its minimum, negative for the other way"
    foreach: [snapshot, link]
    expression: Link_p >= Link_p_min_pu * Link_p_nom
  Link_fix_p_upper:
    description: "`Link-fix-p-upper` — a link carries at most its nominal power"
    foreach: [snapshot, link]
    expression: Link_p <= Link_p_max_pu * Link_p_nom
  Line_fix_s_lower:
    description: "`Line-fix-s-lower` — a fixed line carries at least the negative of its rating, the loss counted against it"
    foreach: [snapshot, line]
    where: not Line_s_nom_extendable
    expression: Line_s - Line_loss >= -Line_s_max_pu * Line_s_nom
  Line_fix_s_upper:
    description: "`Line-fix-s-upper` — a fixed line carries at most its rating, loss included"
    foreach: [snapshot, line]
    where: not Line_s_nom_extendable
    expression: Line_s + Line_loss <= Line_s_max_pu * Line_s_nom
  Line_ext_s_lower:
    description: "`Line-ext-s-lower` — an extendable line carries at least the negative of its rating of the chosen build"
    foreach: [snapshot, line]
    where: Line_s_nom_extendable
    expression: Line_s - Line_loss >= -Line_s_max_pu * Line_s_nom_ext
  Line_ext_s_upper:
    description: "`Line-ext-s-upper` — an extendable line carries at most its rating of the chosen build"
    foreach: [snapshot, line]
    where: Line_s_nom_extendable
    expression: Line_s + Line_loss <= Line_s_max_pu * Line_s_nom_ext
  Line_ext_s_nom_lower:
    description: "`Line-ext-s_nom-lower` — the chosen build is at least its floor"
    foreach: [line]
    where: Line_s_nom_extendable
    expression: Line_s_nom_ext >= Line_s_nom_min
  Line_ext_s_nom_upper:
    description: "`Line-ext-s_nom-upper` — the chosen build is at most its cap; a cap of infinity is no row"
    foreach: [line]
    where: Line_s_nom_extendable AND Line_s_nom_max
    expression: Line_s_nom_ext <= Line_s_nom_max
  Kirchhoff_Voltage_Law:
    description: >-
      `Kirchhoff-Voltage-Law` — around every independent cycle the
      impedance-weighted flows sum to nothing, which is what makes the linear
      power flow physical rather than transport
    foreach: [snapshot, cycle]
    expression: sum(Line_s * Line_cycle_weight, over=line) == 0
  Bus_nodal_balance:
    description: >-
      `Bus-nodal_balance` — what is generated at a bus, plus what the links and
      lines bring, meets the load there, less half of every incident line's
      loss — PyPSA dissipates a branch's loss half at either end
    foreach: [snapshot, bus]
    expression: >-
      sum(Generator_p, by=Generator_bus)
      - sum(Link_p, by=Link_bus0)
      + sum(at(Link_p, by=Link_output_link) * Link_efficiency, by=Link_output_bus)
      - sum(Line_s, by=Line_bus0)
      + sum(Line_s, by=Line_bus1)
      - 0.5 * sum(Line_loss, by=Line_bus0)
      - 0.5 * sum(Line_loss, by=Line_bus1)
      == sum(Load_p_set, by=Load_bus)
  Line_loss_upper:
    description: "`Line-loss_upper` — a line dissipates at most the loss at its rating"
    foreach: [snapshot, line]
    expression: Line_loss <= Line_loss_max
  Line_loss_tangents_forward:
    description: >-
      `Line-loss_tangents-{k}-1` — the loss sits above every tangent to its
      curve for flow one way; PyPSA names one row per segment `k`, this block
      states them all over the segment dimension
    foreach: [snapshot, line, segment]
    expression: Line_loss + Line_loss_slope * Line_s >= Line_loss_offset
  Line_loss_tangents_reverse:
    description: "`Line-loss_tangents-{k}--1` — the same fan mirrored, the loss depending on the flow's magnitude"
    foreach: [snapshot, line, segment]
    expression: Line_loss - Line_loss_slope * Line_s >= Line_loss_offset

objective:
  sense: minimize
  description: operating cost by weighted snapshot, plus what the lines cost to build
  expression: >-
    sum(Generator_p * Generator_marginal_cost * snapshot_weightings_objective)
    + sum(Link_p * Link_marginal_cost * snapshot_weightings_objective)
    + sum(Line_s_nom_ext * Line_capital_cost)
