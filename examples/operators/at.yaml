description: >-
  The adjoint of the membership reduction — `at(array, by=relation(c))` reads
  one coarse value once per fine label pointing at it, and lands on the whole
  key.

dimensions:
  snapshot: { dtype: int }
  period: { dtype: int }

relations:
  period_of: { key: snapshot, values: period }

parameters:
  cap: { dims: [period] }

variables:
  p:
    dims: [snapshot]
    bounds: { lower: 0 }

constraints:
  within_cap:
    dims: [snapshot]
    expression: p <= at(cap, by=period_of(period))

objective: { sense: minimize, expression: sum(p) }
