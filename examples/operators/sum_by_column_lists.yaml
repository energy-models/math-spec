description: >-
  Several columns at each end — `sum(array, over=[dim, …], by=relation[c, …])`
  joins on both key columns at once and groups by both value columns in one
  join.

dimensions:
  generator: { dtype: str }
  period: { dtype: int }
  bus: { dtype: str }
  technology: { dtype: str }

relations:
  slot_of: { key: [generator, period], values: [bus, technology] }

parameters:
  cap: { dims: [bus, technology] }

variables:
  p:
    dims: [generator, period]
    bounds: { lower: 0 }

constraints:
  slot_cap:
    dims: [bus, technology]
    expression: sum(p, over=[generator, period], by=slot_of[bus, technology]) <= cap

objective: { sense: minimize, expression: sum(p) }
