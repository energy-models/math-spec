description: >-
  A call with several columns at each end — `sum(array, by=relation([a, …] -> [b, …]))`
  consumes both key columns at once and lands on the product of both value
  columns in one join.

dimensions:
  generator: { dtype: str }
  period: { dtype: int }
  bus: { dtype: str }
  technology: { dtype: str }

relations:
  slot_of: { key: [generator, period], values: [bus, technology] }

parameters:
  cap: { dims: [bus, technology] }

variables:
  p:
    dims: [generator, period]
    bounds: { lower: 0 }

constraints:
  slot_cap:
    dims: [bus, technology]
    expression: sum(p, by=slot_of([generator, period] -> [bus, technology])) <= cap

objective: { sense: minimize, expression: sum(p) }
