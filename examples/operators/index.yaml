description: >-
  Indexing through a relation — `array[relation]` reads one coarse value once
  per fine label pointing at it.

dimensions:
  snapshot: { dtype: int }
  period: { dtype: int }

relations:
  period_of: { key: snapshot, value: period }

parameters:
  cap: { dims: [period] }

variables:
  p:
    dims: [snapshot]
    bounds: { lower: 0 }

constraints:
  within_cap:
    dims: [snapshot]
    expression: p <= cap[period_of]

objective: { sense: minimize, expression: sum(p) }
