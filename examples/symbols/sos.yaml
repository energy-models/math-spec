# The sidecar symbol table for `examples/sos.yaml`. A curve prints through its
# breakpoints, and `x` and `y` are what the piecewise-linear literature calls
# them — said out loud here rather than the typesetter renaming anything behind
# the reader's back.
notation: latex

names:
  bp_x: "\\mathrm{x}"
  bp_y: "\\mathrm{y}"
