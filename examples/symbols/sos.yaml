# The sidecar symbol table for `examples/sos.yaml`. It spells both readings of
# the model: the breakpoints the curve prints through, and the weights the
# expansion writes out, which are named after the block that declared them and
# unreadable in an equation that names one six times. Papers write the
# convex-combination weight as lambda, so this says so out loud rather than the
# typesetter renaming anything behind the reader's back.
notation: latex

names:
  cost_curve_lam: "\\lambda"
  bp_x: "\\mathrm{x}"
  bp_y: "\\mathrm{y}"
