# How `examples/pypsa_quadratic.yaml` prints — the rung 1 symbols, plus the
# quadratic coefficients.
notation: latex
dimensions:
  snapshot: { index: t, set: '\mathcal{T}' }
  bus: { index: n, set: '\mathcal{N}' }
  generator: { index: g, set: '\mathcal{G}' }
  link: { index: l, set: '\mathcal{L}' }
  link_output: { index: o, set: '\mathcal{O}' }
  load: { index: d, set: '\mathcal{D}' }
names:
  snapshot_weightings_objective: '\mathrm{w}'
  Generator_p: p
  Generator_p_nom: '\mathrm{p}^{\mathrm{nom}}'
  Generator_p_min_pu: '\underline{\mathrm{p}}'
  Generator_p_max_pu: '\overline{\mathrm{p}}'
  Generator_marginal_cost: '\mathrm{c}'
  Generator_marginal_cost_quadratic: '\mathrm{c}^{(2)}'
  Link_p: f
  Link_p_nom: '\mathrm{f}^{\mathrm{nom}}'
  Link_p_min_pu: '\underline{\mathrm{f}}'
  Link_p_max_pu: '\overline{\mathrm{f}}'
  Link_efficiency: '\eta'
  Link_marginal_cost: '\mathrm{c}^{f}'
  Link_marginal_cost_quadratic: '\mathrm{c}^{f,(2)}'
  Load_p_set: '\mathrm{load}'
