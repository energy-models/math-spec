# The sidecar symbol table for `examples/piecewise.yaml`. `x` and `y` are what
# the piecewise-linear literature calls the breakpoints, and `lambda` the
# convex-combination weight the expansion writes out.
notation: latex

names:
  cost_curve_lam: "\\lambda"
  bp_x: "\\mathrm{x}"
  bp_y: "\\mathrm{y}"
