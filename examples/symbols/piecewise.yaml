# The sidecar symbol table for `examples/piecewise.yaml`. A curve prints through
# its breakpoints, and `x` and `y` are what the piecewise-linear literature
# calls them.
notation: latex

names:
  bp_x: "\\mathrm{x}"
  bp_y: "\\mathrm{y}"
