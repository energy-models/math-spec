# How `examples/pypsa.yaml` prints. The names are PyPSA's, so the file reads
# beside `n.model`; these symbols make the math read as math.
notation: latex
dimensions:
  snapshot: { index: t, set: '\mathcal{T}' }
  bus: { index: n, set: '\mathcal{N}' }
  generator: { index: g, set: '\mathcal{G}' }
  link: { index: l, set: '\mathcal{L}' }
  load: { index: d, set: '\mathcal{D}' }
  storage_unit: { index: s, set: '\mathcal{S}' }
  store: { index: v, set: '\mathcal{V}' }
  line: { index: k, set: '\mathcal{K}' }
  cycle: { index: c, set: '\mathcal{C}' }
names:
  snapshot_weightings_objective: '\mathrm{w}'
  Generator_p: p
  Generator_p_nom: '\mathrm{p}^{\mathrm{nom}}'
  Generator_p_nom_extendable: '\mathrm{ext}'
  Generator_p_min_pu: '\underline{\mathrm{p}}'
  Generator_p_max_pu: '\overline{\mathrm{p}}'
  Generator_marginal_cost: '\mathrm{c}'
  Generator_committable: '\mathrm{com}'
  Generator_ramp_limit_up: '\mathrm{ru}'
  Generator_ramp_limit_down: '\mathrm{rd}'
  Generator_ramp_limit_start_up: '\mathrm{ru}^{\mathrm{up}}'
  Generator_ramp_limit_shut_down: '\mathrm{rd}^{\mathrm{dn}}'
  Generator_status: "u"
  Generator_start_up: '\mathit{up}'
  Generator_shut_down: '\mathit{dn}'
  Generator_min_up_time: '\mathrm{UT}'
  Generator_min_down_time: '\mathrm{DT}'
  Generator_status_initial: '\mathrm{u}^{0}'
  Generator_must_stay_up: '\mathrm{hold}'
  Generator_start_up_cost: '\mathrm{c}^{\mathrm{up}}'
  Generator_shut_down_cost: '\mathrm{c}^{\mathrm{dn}}'
  Generator_stand_by_cost: '\mathrm{c}^{\mathrm{on}}'
  Generator_p_nom_mod: '\mathrm{p}^{\mathrm{mod}}'
  Generator_n_mod: "N"
  Generator_big_m: '\mathrm{M}'
  Generator_p_min_pu_nonneg: '\mathrm{nonneg}'
  Link_ramp_limit_up: '\mathrm{ru}^{f}'
  Link_ramp_limit_down: '\mathrm{rd}^{f}'
  Link_p: f
  Link_p_nom: '\mathrm{f}^{\mathrm{nom}}'
  Link_p_nom_extendable: '\mathrm{ext}^{f}'
