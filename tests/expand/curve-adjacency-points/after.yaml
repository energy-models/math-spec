dimensions:
  bp: { dtype: int }

parameters:
  x_bp: { dims: [bp] }
  y_bp: { dims: [bp] }

variables:
  x: { dims: [], bounds: { lower: 0 } }
  y: { dims: [], bounds: { lower: 0 } }
  curve_lam:
    dims: [bp]
    where: x_bp
    bounds: { lower: 0, upper: 1 }
    description: convex-combination weight on a breakpoint
  curve_seg:
    dims: [bp]
    where: x_bp
    domain: binary
    description: a binary per segment, 1 where the two members it spans may be nonzero

constraints:
  curve_convexity:
    dims: []
    where: count(x_bp, over=bp) > 0
    expression: sum(curve_lam, over=bp) == 1
  curve_x:
    dims: []
    where: count(x_bp, over=bp) > 0
    expression: (x) == sum(curve_lam * x_bp, over=bp)
  curve_y:
    dims: []
    where: count(x_bp, over=bp) > 0
    expression: (y) == sum(curve_lam * y_bp, over=bp)
  curve_pick:
    dims: []
    expression: sum(curve_seg, over=bp) <= 1
  curve_adjacency:
    dims: [bp]
    expression: curve_lam <= (curve_seg + shift(curve_seg, along=bp, offset=1, edge=0))

assumptions:
  curve_complete:
    where: x_bp
    holds: x_bp AND y_bp
    description: >-
      piecewise 'curve': every breakpoint the curve runs through needs a row in
      'x_bp', 'y_bp' — a missing row is read as a zero rather than as a shorter
      curve, so it sits the curve on the origin. Bind the rows, or narrow
      where: 'x_bp' to where the curve runs.
  curve_contiguous:
    holds: count(x_bp AND NOT shift(x_bp, along=bp, offset=1), over=bp) == 1
    where: count(x_bp, over=bp) > 0
    description: >-
      piecewise 'curve': where: 'x_bp' must mark a consecutive run of at least
      one breakpoint per curve — the weights are nonzero only on two
      neighbouring breakpoints, and a gap leaves no neighbour across it.
