dimensions:
  bp: { dtype: int }

parameters:
  x_bp: { dims: [bp] }
  y_bp: { dims: [bp] }

variables:
  x: { dims: [], bounds: { lower: 0 } }
  y: { dims: [], bounds: { lower: 0 } }
  running: { dims: [], domain: binary }

piecewise:
  curve:
    over: bp
    activity: running
    links:
      - [x, x_bp]
      - [y, y_bp]
