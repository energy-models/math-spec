# Every rendering path, in one model. See README.md — this is not meant to be
# a sensible optimisation problem, only an exhaustive one.

# A description is a rendering path too, and this one carries every character
# the notations escape: CI's pdflatex run over this file is what proves the
# LaTeX escapes are *right*, where the .out files only prove they are there.
description: >-
  every character a notation escapes, set as text: link_to, 100% & #1 costs
  $5 {net} ~ ^ \ *star* @ref <label>, and `a_name` in backticks set in code

dimensions:
  snapshot: { dtype: int }
  generator: { dtype: str }
  bus: { dtype: str }
  zone: { dtype: str }
  season: { dtype: str }
  technology: { dtype: str }

relations:
  gen_bus: { key: generator, values: bus }
  zone_of: { key: bus, values: zone }
  area_of: { key: bus, values: zone } # a second map into the same set, to compare against
  season_of: { key: snapshot, values: season }
  gen_zone: { key: [generator, snapshot], values: zone } # a map keyed by two dimensions: a call consumes one and joins on the other
  rep_of: { key: snapshot, values: { rep: snapshot } } # a map into its own dimension: the representative snapshot
  connection: { key: [generator, bus] } # a bare relation, with no value columns: many-to-many, read only by sum with both ends named
  gen_bt: { key: generator, values: [bus, technology] } # one table with two value columns, read to both at once

parameters:
  p_max: { dims: [generator] }
  p_min: { dims: [generator] }
  cost: { dims: [generator] }
  load: { dims: [snapshot, bus] }
  is_flexible: { dims: [generator], dtype: bool }
  zone_cap: { dims: [zone] }
  tech_cap: { dims: [bus, technology] }
  min_up: { dims: [generator], dtype: int }
  eta: { dims: [generator] } # a Greek name that is *given*, so the rule wins and it prints as the word
  lead: { dims: [generator], dtype: int }
  budget: { dims: [] } # scalar: the legend says so rather than printing an empty product
  growth: { dims: [] } # the base of a power; the exponent is `lead`, a column

variables:
  p: # both bounds, and a where with all three connectives
    dims: [snapshot, generator]
    where: "p_max > 0 AND NOT is_flexible OR p_min > 0"
    bounds: { lower: p_min, upper: p_max }
  spill: # lower only
    dims: [snapshot]
    bounds: { lower: 0 }
  slack: # upper only
    dims: [snapshot]
    bounds: { upper: 100 }
  theta: # unbounded
    dims: [bus]
  on: # a binary domain, which is a set rather than a pair of bounds
    dims: [snapshot, generator]
    domain: binary
  units: # an integer domain, which is both: bounds, and where the values live
    dims: [generator]
    domain: integer
    bounds: { lower: 0, upper: 10 }
  spare: # integer with neither bound: the domain is the whole line
    dims: [generator]
    domain: integer
  reserve: # an empty dims: a scalar declaration, whose line carries no quantifier
    dims: []
    bounds: { lower: 0 }
  headroom: # scalar too, but masked, so the condition stands with no set beside it
    dims: []
    where: "budget"
    bounds: { lower: 0 }
  weight: # the family a sos runs along
    dims: [snapshot, generator]
    bounds: { lower: 0, upper: 1 }

sos:
  adjacent: # at most two adjacent members nonzero, one set per snapshot
    variable: weight
    over: generator
    type: 2

expressions:
  spend: # a plain named expression: its symbol prints where it is used, its body once as a definition
    description: what a snapshot's dispatch costs
    expression: sum(p * cost, over=generator)
  lcoe: sum(p * cost) / sum(p) # nothing in the math reads it, so its divisor may carry a variable
  marginal_price: dual(balance) # the row dual of a constraint, the one builtin only an entry the math never reads may call
  startup_cost: # a quantity defined by region: no two cases overlap, and `otherwise` is the rest
    description: what starting a unit in this snapshot costs, which the horizon's edge changes
    dims: [snapshot, generator]
    cases:
      opening: { when: "position(snapshot) == 0", expression: cost }
      winter: { when: "position(snapshot) > 0 and season_of == 'winter'", expression: cost * 2 }
    otherwise: 0

constraints:
  budgeted: # names the plain expression: its symbol prints here, its definition once below
    dims: [snapshot]
    expression: spend <= budget
  starts: # names the cased expression: its symbol prints here, its block once below
    dims: [snapshot, generator]
    expression: p <= startup_cost
  balance: # sum over a relation
    dims: [snapshot, bus]
    expression: sum(p, over=gen_bus.generator) + spill - slack == load
  ramp: # roll (cyclic) and shift (acyclic) in one equation
    dims: [snapshot, generator]
    expression: p - shift(p, along=snapshot, offset=1, edge='wrap') <= shift(p, along=snapshot, offset=1) + p_max
  edges: # the two translations `ramp` leaves out: a fill, and forwards
    dims: [snapshot, generator]
    expression: >-
      shift(p, along=snapshot, offset=1, edge=0)
      <= shift(p, along=snapshot, offset=-1, edge=0) + p_max
  ahead: # the cyclic translation forwards, which is a fourth symbol again
    dims: [snapshot, generator]
    expression: p <= shift(p, along=snapshot, offset=-1, edge='wrap')
  composed: # two steps of one policy are one step; a zero step is none at all
    dims: [snapshot, generator]
    expression: shift(shift(p, along=snapshot, offset=1), along=snapshot, offset=1) <= shift(p_max, along=generator, offset=0)
  uncomposed: # a named offset under a numbered one stays two steps, not their sum
    dims: [snapshot, generator]
    expression: shift(shift(p, along=snapshot, offset=lead, edge=0), along=snapshot, offset=1) <= p_max
  crossed: # two dimensions translated at one leaf, each with its own policy
    dims: [snapshot, generator]
    expression: shift(shift(p, along=snapshot, offset=1, edge='wrap'), along=generator, offset=-1) <= p_max
  lead_time: # an offset the data carries, so it prints as a symbol rather than a number
    dims: [snapshot, generator]
    expression: shift(p, along=snapshot, offset=lead, edge=0) <= p_max
  in_season: # a translation partitioned by a relation: the group rides on the operator
    dims: [snapshot, generator]
    expression: p <= shift(p, along=season_of.snapshot, offset=1, edge='wrap', within=season)
  held_in_season: # the same group, with a fill: each season's opening row is kept and given a zero
    dims: [snapshot, generator]
    expression: p <= shift(p, along=season_of.snapshot, offset=1, edge=0, within=season)
  window: # a trailing window of fixed width
    dims: [snapshot, generator]
    expression: sum_back(on, along=snapshot, window=3) <= units
  history: # the same window, its width in the data and its edge wrapped
    dims: [snapshot, generator]
    expression: sum_back(on, along=snapshot, window=min_up, edge='wrap') <= units
  seasonal_window: # a window partitioned by a relation: the group rides on the operator
    dims: [snapshot, generator]
    expression: sum_back(on, along=season_of.snapshot, window=3, within=season) <= units
  pullback: # at(), which re-indexes through a relation instead of an offset
    dims: [snapshot, bus]
    expression: spill <= at(zone_cap, by=zone_of, over=zone, into=bus)
  grouped_once: # one table read to two value columns: the domain carries a condition per column
    dims: [snapshot, bus, technology]
    expression: sum(p, by=gen_bt.[bus, technology]) <= tech_cap
  pulled_back_once: # its adjoint, reading one slot through two columns of one table
    dims: [generator]
    expression: units <= at(tech_cap, by=gen_bt, over=[bus, technology], into=generator)
  within_bus: # a partition grouped by one named value column of a two-value table, and a position within both
    dims: [generator]
    where: "position(gen_bt.generator, within=[bus, technology]) == 0"
    expression: units <= shift(units, along=gen_bt.generator, offset=1, edge=0, within=bus)
  relational: # a sum through a bare relation: the domain is a row of the relation rather than a function's value
    dims: [snapshot, bus]
    expression: sum(p, by=connection.bus) <= load
  connected: # a bare relation as a where: the row of the frame has to be a member of the relation
    dims: [snapshot, generator, bus]
    where: "connection"
    expression: p <= load
  representative: # a map into its own dimension, read both ways: the frame is unchanged and the index is primed
    dims: [snapshot]
    expression: sum(spill, over=rep_of.snapshot) <= at(spill, by=rep_of, over=rep, into=snapshot)
  zonal: # a grouping through a two-key map, consuming one key: the condition reads the other, and the row keeps it
    dims: [snapshot, zone]
    expression: sum(p, over=gen_zone.generator) <= zone_cap
  zonal_history: # the same table consuming its other key
    dims: [generator, zone]
    expression: sum(p, over=gen_zone.snapshot) <= zone_cap
  zonal_membership: # the same table read between its two key columns: no value column is read, so the domain asks only that the row is there
    dims: [snapshot]
    expression: sum(units, by=gen_zone.snapshot) <= budget
  zonal_pullback: # its adjoint, reading the slot the row's own snapshot puts the generator in
    dims: [snapshot, generator]
    where: "gen_zone == 'north' AND position(gen_zone.generator, within=zone) == 0"
    expression: p <= at(spill * zone_cap, by=gen_zone, into=generator, over=zone)
  arithmetic: # division, both unary signs, a sign beside a sign, floats with and without an exponent, bracketing
    dims: [snapshot]
    expression: >-
      sum(p / 2 + -cost - -1e-5 * p + 2.5e-7 * cost + 0.5 * p, over=generator)
      >= -sum(+p, over=generator) * -3
  total: # a sum naming no dim, whose domain is the one place the dims it took are said
    dims: []
    expression: sum(p) <= budget
  scalar: # a parameter over nothing, and a mask that is a bare parameter
    dims: [generator]
    where: "cost"
    expression: units <= budget
  running: # a mask on a variable's existence, and one on a dimension's label
    dims: [snapshot, bus]
    where: "theta AND snapshot >= 3"
    expression: theta <= load
  first: # a position in a dimension, and the same position within a group
    dims: [snapshot, generator]
    where: "position(snapshot) == 0 OR position(season_of.snapshot, within=season) == 0"
    expression: on == 1
  last: # the same two counted from the end, which print against a size rather than as themselves
    dims: [snapshot, generator]
    where: "position(snapshot) == -1 OR position(season_of.snapshot, within=season) == -1"
    expression: on == 0
  northern: # a relation compared to a label, to another relation, and to nothing
    dims: [snapshot, bus]
    where: "zone_of == 'north' AND zone_of != area_of AND zone_of"
    expression: slack <= load
  efficiency: # a Greek-named parameter, which is given — so the convention wins and it prints as the word
    dims: [snapshot, generator]
    expression: p <= eta * p_max
  ceiling: # the infinity literal, which is the one way infinity prints
    dims: [bus]
    expression: theta <= inf
  always: # a mask that is only the constant true, which the language says is no mask at all — so none prints
    dims: [snapshot]
    where: "true"
    expression: spill >= 0
  redundant: # the same constant *inside* a mask, where it is what the file says and prints
    dims: [snapshot]
    where: "True AND spill"
    expression: spill >= 0
  never: # the other constant mask, which says the rows are none and is worth seeing
    dims: [snapshot]
    where: "false"
    expression: slack >= 0

objective: # a sense, a product of two variables, a power over two parameters, a power of one of those, and the summations a scalar objective spells out beside two scalar terms
  sense: maximize
  expression: sum(p * cost) + sum(p * p * cost) + sum(p * cost * growth ** lead) + sum(p * (growth ** lead) ** 2) + sum(p * p_max) - reserve + -headroom
