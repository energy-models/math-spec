version: 2

mkdocs:
  configuration: mkdocs.yml

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi latest
      - asdf global pixi latest
    install:
      # `default` already carries the docs feature; there has never been a
      # `doc` environment for this to select, so the install failed outright.
      - pixi install -e default --frozen
    build:
      html:
        - pixi run docs-build $READTHEDOCS_OUTPUT
