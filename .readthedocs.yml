version: 2

mkdocs:
  configuration: mkdocs.yml

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi latest
      - asdf global pixi latest
    install:
      # `--frozen` so the site is built from pixi.lock, exactly as CI is. The
      # docs feature is part of the default environment; the template's
      # generated `-e doc` names an environment that does not exist.
      - pixi install -e default --frozen
    build:
      html:
        - pixi run docs-build $READTHEDOCS_OUTPUT
