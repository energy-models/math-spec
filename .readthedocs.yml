version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

# Read the Docs' native uv support: this lowers to `uv sync --group docs`,
# the same command CI runs. `uv.lock` is not committed, so both resolve
# fresh — the site is built against current dependencies, not pinned ones.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
