version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi latest
      - asdf global pixi latest
    install:
      # `default` already carries the docs feature; there has never been a
      # `doc` environment for the template's generated `-e doc` to select, so
      # the install failed outright. `--frozen` builds the site from pixi.lock,
      # exactly as CI does.
      - pixi install -e default --frozen
    build:
      html:
        - pixi run docs-build
        # `zensical build` takes no site directory, so the site lands in
        # `site_dir` from mkdocs.yml and is copied from there. Read the Docs
        # publishes whatever is under $READTHEDOCS_OUTPUT/html.
        - mkdir -p $READTHEDOCS_OUTPUT && cp -a .docs $READTHEDOCS_OUTPUT/html
